[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whiskerless"
version = "0.2.0-rc.36"
description = "Un-cloud your Whisker devices — fully-local MQTT control + telemetry for the Litter-Robot 4."
readme = "README.md"
license = "MIT"
# 3.11 is an API boundary, not a preference: asyncio.timeout() landed in 3.11 and
# carries the read/verify waits in link.py, client.py and the CLI. Supporting 3.10
# (Ubuntu 22.04 LTS) would mean taking the async-timeout backport as a runtime
# dependency for one call. CI tests 3.11.0 exactly — "3.11" resolves to the newest
# patch, which is not the floor anyone actually has.
requires-python = ">=3.11"
authors = [{ name = "Cody Bryant" }]
keywords = ["litter-robot", "whisker", "mqtt", "home-assistant", "local", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

# aiomqtt is the only hard runtime dep: it carries the codec/command layer that
# both the CLI and the Home Assistant integration build on. BLE re-provisioning
# is bench-only, so bleak is an optional extra rather than a baseline cost.
#
# 2.0.0 is an API boundary: 1.x exposed `Client.messages` as a method used through
# `async with client.messages() as m`, while 2.0 made it the attribute this code
# iterates directly (`async for message in client.messages`). 1.x cannot run this.
dependencies = [
    "aiomqtt>=2.0.0",
    # Certificates are the whole authentication story now: the robot cannot send a
    # username or password, so every client identifies by certificate. Generating a
    # CA and issuing per-robot client certs is therefore core function, not a
    # nicety, and it must not hinge on an `openssl` binary that stock Windows does
    # not have. Prebuilt wheels exist for macOS, Linux and Windows.
    "cryptography>=43",
]

[project.optional-dependencies]
# NOT an API boundary — the two bleak features used here (`BleakScanner.discover(
# return_adv=True)` and `BleakClient.services` as a property) both exist in 0.20.2.
# 0.22.0 is a deliberate SUPPORT floor: it is the version CI installs and tests, and
# claiming older releases would mean supporting backend fixes nobody here has run.
# Lower it only together with the dependency-floors CI job that proves it.
ble = ["bleak>=0.22.0"]
# Exact, not floors — matching dreame-valetudo, and on the same versions. CI installed these
# unpinned, so an upstream release (a ruff that enforces a new lint, a mypy whose `strict` moved)
# could redden main with no code change here. Renovate bumps them via the `# renovate:` markers,
# surfaced as a green-gated PR rather than a surprise. These are TOOLS; the runtime dependencies
# above stay floors, because this ships as a library and a library that pins its own dependencies
# is unusable downstream.
dev = [
    # renovate: datasource=pypi depName=mypy
    "mypy==2.3.1",
    # renovate: datasource=pypi depName=pytest
    "pytest==9.1.1",
    # renovate: datasource=pypi depName=pytest-asyncio
    "pytest-asyncio==1.4.0",
    # renovate: datasource=pypi depName=pytest-cov
    "pytest-cov==7.1.0",
    # Only the repo-invariant tests need it: quality_scale.yaml and the shipped
    # example automations are checked for drift, and neither is Python.
    # renovate: datasource=pypi depName=pyyaml
    "pyyaml==6.0.3",
    # renovate: datasource=pypi depName=ruff
    "ruff==0.16.3",
]
# Home Assistant integration tests (Python 3.13). Install in a separate env:
#   pip install -e '.[test-ha]' && pytest tests/integration
test-ha = [
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component",
    "syrupy>=4.0",
]

# Source points at Forgejo because that is where the code actually lives and where releases are
# cut; GitHub is a mirror. Homepage, docs and issues point at GitHub because that is where users
# are — HACS installs from it, and issues and pull requests are handled there.
[project.urls]
Homepage = "https://github.com/SisyphusMD/whiskerless"
Documentation = "https://github.com/SisyphusMD/whiskerless/tree/main/docs"
Source = "https://forgejo.bryantserver.com/SisyphusMD/whiskerless"
Issues = "https://github.com/SisyphusMD/whiskerless/issues"

[project.scripts]
whiskerless = "whiskerless.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/whiskerless"]

[tool.ruff]
line-length = 100
# The repo has two floors: the library ships to PyPI at 3.11+, the integration
# runs on HA's 3.13 and uses PEP 695 freely. A single target-version can't say
# that — at py312 ruff pushes the library toward 3.12-only syntax (UP040), and
# at py311 it rejects the integration's `type` aliases as invalid syntax.
target-version = "py311"
src = ["src", "tests", "custom_components"]

[tool.ruff.per-file-target-version]
"custom_components/**" = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PTH", "BLE",
          # PLW catches module-global mutation, which is how robot_profiles.py used to hand
          # migration results to the CLI. PLC0415 is deliberately NOT enabled: the lazy
          # imports for optional heavy dependencies are an architectural choice.
          "PLW"]
ignore = [
    "E501",                       # long protocol comments/tables are allowed
    "ASYNC109",                   # a `timeout` param that wraps asyncio.timeout is a fine API
    "RUF001", "RUF002", "RUF003", # typographic en-dashes in prose/ranges are intentional
]

[tool.ruff.lint.per-file-ignores]
# The CLI is a short-lived process; blocking input()/path reads in async handlers
# are acceptable rather than worth an executor hop.
"src/whiskerless/cli.py" = ["ASYNC230", "ASYNC240", "ASYNC250"]

[tool.ruff.lint.isort]
known-first-party = ["whiskerless"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_generics = true
files = ["src/whiskerless"]

[[tool.mypy.overrides]]
# bleak ships no py.typed in some releases; keep BLE typing best-effort.
module = ["bleak.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Coverage of the INTEGRATION only. Both suites here are held at 99%, which is
# above what the quality scale asks (95%, test-coverage); config_flow.py is a
# separate 100% (config-flow-test-coverage), so CI reports the whole package and
# gates the config flow on its own rather than averaging the two together.
[tool.coverage.run]
source = ["custom_components/whiskerless"]
branch = true

[tool.coverage.report]
# Without this, --cov-fail-under compares the total rounded to whole percent, so
# 94.6% passes a 95% floor.
precision = 2
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]
