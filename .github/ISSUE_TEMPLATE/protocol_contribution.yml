name: Protocol finding (help crack the missing commands)
description: Share a captured command or a confirmed register so we can close an open item
labels: ["protocol"]
body:
  - type: markdown
    attributes:
      value: |
        Some actions are deliberately **not** exposed yet — power on/off, the empty
        cycle, and the panel/drawer resets — because we couldn't pin their exact
        register+value to safe, proven confidence (see
        [compatibility.md](../../docs/devices/litter-robot-4/compatibility.md)).

        The low-risk way to chip at one: watch the local `activity` topic on a
        whiskerless-provisioned robot, press one **physical panel button**, and note
        the time so the event can be tied to the action. The robot reports what it did
        as `0xRRVVVV`. Register `0x01` was found exactly this way. Share it here!

        Note what this proves: the robot REPORTING a code is not the same as that
        code TRIGGERING the action when written back. Captures like this are strong
        candidates; promoting one to a shipped command still needs a deliberate,
        reviewed write test.

        (Sniffing the cloud's own command bytes does not work — a cloud-paired robot
        talks to Whisker's AWS broker, not yours.)
  - type: dropdown
    id: action
    attributes:
      label: Which action did you capture?
      options:
        - powerOn
        - powerOff
        - emptyCycle
        - shortResetPress (panel reset)
        - reset waste drawer
        - other / a new register
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Robot firmware version
      placeholder: "ESP 1.1.75"
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: The captured code(s)
      description: >-
        The exact `0x...` codes, and how you captured them. Local activity events are
        the usual source; cloud diagnostics values are welcome too, labelled as such.
      placeholder: '{"type":"action","data":["0x010401"]}'
    validations:
      required: true
  - type: textarea
    id: effect
    attributes:
      label: Observed effect
      description: What the robot did, and any before/after state (e.g. unitPowerStatus, odometer counts).
