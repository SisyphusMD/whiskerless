name: Bottles (Homebrew)

# Prebuilt kegs for the tap, so `brew install` stops compiling cryptography.
# Without them Homebrew builds every resource from source, and cryptography's
# Rust extension drags in `rust` → `llvm`: ~2.4 GB downloaded and several minutes
# of compiling on every user's machine, for a package that is otherwise pure
# Python.
#
# On GitHub, and this is the exception to the rule in docs/design/ci-split.md
# rather than an example of it. Forgejo has no macOS runner, so the two macOS
# bottles have nowhere else to go. `arm64_linux` has no NATIVE arm64 runner here
# either, and a bottle is by definition a from-source build — measured at ~18
# minutes natively, so emulating it is not a trade worth making. The x86_64 one
# could run on Forgejo, and is built here anyway because bottle-block.py refuses a
# set whose manifests disagree on `cellar`; one matrix on one forge is how that
# stays true.
#
# (The previous note here said Forgejo's Linux runner is "arm64-only". It is the
# other way round — every Forgejo runner is x86_64 and arm64 is the emulated one —
# and the mistake sent the install matrix to the wrong forge for a while.)
#
# Ordering is enforced rather than assumed. A bottle is produced by INSTALLING
# the published formula, so build-bottles.sh waits for publish.yml's first tap
# pass; publish.yml's `homebrew-bottles` job then waits for the assets this
# uploads and writes the `bottle do` block in a second pass.
on:
  push:
    tags: ["v*.*.*"]
  # Dispatchable for the same reason as ci.yml and publish.yml (#74): Forgejo has
  # no rerun API and GitHub's is not reachable from the release, so one leg
  # failing on infrastructure must not cost a whole candidate. Re-running is
  # safe — the release helpers replace an asset rather than duplicating it.
  #
  # The tag is an INPUT rather than the dispatch ref, because those are two
  # different things when the reason for re-running is a fix to the build script
  # itself: a dispatch at the tag would faithfully re-run the broken version of
  # this workflow. Dispatching from a branch runs the CURRENT scripts against the
  # named release, which is what recovery actually needs. Nothing about the
  # bottle's contents comes from this checkout — it is built by installing the
  # published formula, which points at the published sdist.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build bottles for, e.g. v0.2.0-rc.28"
        required: true
        type: string

permissions:
  contents: write

env:
  # The push trigger has no inputs; the dispatch trigger has no meaningful ref.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Bottle ${{ matrix.label }}
    # Forgejo Actions also reads .github/workflows and has none of these runners.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other three: a partial set is
      # still worth publishing, and the missing leg can be dispatched on its own.
      fail-fast: false
      matrix:
        include:
          # ONE BOTTLE PER ARCH, not per macOS release. Homebrew pours an older
          # bottle when none matches the running OS — verified on a macOS 27
          # machine, which poured `arm64_tahoe` (26) bottles — so building the
          # oldest supported release covers every newer one. macos-15 is that
          # floor and GitHub carries it until August 2027. (macOS 16–25 do not
          # exist; Apple went 15 → 26 → 27, so 15 and 26 are consecutive.)
          - os: macos-15
            label: arm64_sequoia
          - os: macos-15-intel
            label: sequoia
          - os: ubuntu-24.04
            label: x86_64_linux
          - os: ubuntu-24.04-arm
            label: arm64_linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the bottles (macOS — the runner's own Homebrew)
        if: ${{ runner.os == 'macOS' }}
        # Same ghcr.io exposure as the Linux leg below; see the note there.
        env:
          HOMEBREW_CURL_RETRIES: 8
        run: bash packaging/build-bottles.sh "$TAG" "$GITHUB_WORKSPACE/bottles"
      - name: Build the bottles (Linux — the pinned linuxbrew image)
        # Not the runner's Homebrew: GitHub documents no Homebrew on the arm64
        # Ubuntu image, and installing it from the upstream one-liner would be
        # the only unpinned thing in this pipeline. This is the same image, at
        # the same digest, that the Linux formula smoke already proves the
        # formula in — so the bottle is built where the formula is known to work.
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          # The image runs as `linuxbrew` (uid 1000) and the runner checks out as
          # a different uid, so the output directory has to be writable by it.
          mkdir -p bottles && chmod 777 bottles
          # renovate: datasource=docker depName=homebrew/brew
          IMAGE="homebrew/brew:latest@sha256:b0072bfdebf5934ae24b93b44a1928a88057399b3283ffa0177bb86084fdedfd"
          # brew pulls this formula's dependency closure from ghcr.io, and a single blob that fails
          # to download aborts the whole platform — which then strands the tap's second pass waiting
          # for a manifest that will never arrive. The formula smoke has always set this; the bottle
          # build had not. Passed with -e so it reaches the brew INSIDE the container, not just the
          # runner's shell.
          docker run --rm -e TAG -e HOMEBREW_CURL_RETRIES=8 \
            -v "$PWD:/repo:ro" -v "$PWD/bottles:/out" "$IMAGE" \
            bash -lc 'bash /repo/packaging/build-bottles.sh "$TAG" /out'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-${{ matrix.label }}
          path: bottles/*
          # A dispatched re-run must not trip over its own earlier attempt.
          overwrite: true

  publish:
    name: Append the bottles to the GitHub + Forgejo releases
    needs: build
    # `!cancelled()`, not the default: `needs` alone skips this job the moment ANY
    # matrix leg fails, which would throw away the three bottles that did build
    # and force all four platforms to succeed in one run. Publishing what arrived
    # is what makes dispatching a single failed leg later actually work. A missing
    # platform is still caught where it matters — bottle-block.py refuses to write
    # a block that is not the full set.
    if: ${{ !cancelled() && github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bottles
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: bash packaging/changelog-section.sh "${TAG#v}" > notes.md
      - name: Append the bottles + their manifests to both releases
        # The .json manifests ride along deliberately: publish.yml's second tap
        # pass reads them back off the Forgejo release to build the block, and
        # they are the only record of which sha256 belongs to which platform.
        run: |
          set -uo pipefail
          ls -l bottles/
          chmod +x packaging/github-release.sh packaging/forgejo-release.sh
          # Each destination is attempted whatever the other did, and failures are
          # re-raised at the end — the same shape the main release job uses, for
          # the same reason (#76). It matters more here than it looks: Forgejo is
          # the bottle block's root_url, so letting a transient GitHub failure
          # skip it would guarantee the tap pass times out for a reason that has
          # nothing to do with the tap.
          #
          # BOTTLES ONLY, and replaceable on purpose. Every other asset is immutable once published,
          # which is what makes the cross-registry quorum meaningful — but a bottle is not
          # byte-reproducible (its gzip header carries the build timestamp), so a dispatched rebuild
          # after a partial run legitimately produces different bytes. Under the default `immutable`
          # the first already-published platform raises a conflict, and the recovery this workflow
          # is dispatchable FOR cannot complete. The sibling sets it for the same reason.
          export REL_REPLACE_POLICY=replace
          failed=""
          packaging/github-release.sh "${{ secrets.GITHUB_TOKEN }}" \
            "$TAG" notes.md bottles/* || failed="$failed github.com"
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$TAG" notes.md bottles/* \
            || failed="$failed forgejo.bryantserver.com"
          if [ -n "$failed" ]; then
            echo "::error::bottle publishing failed for:$failed"
            exit 1
          fi
