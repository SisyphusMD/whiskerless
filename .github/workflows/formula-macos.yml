name: Homebrew formula (macOS)

# The release gate (`mirror-gate` in the Forgejo release workflows) refuses to
# tag until this workflow is green on the commit being released, and a
# cancelled run counts as not-green, so a push landing during a release cut must
# never cancel the run the release is waiting on.
#
# So: keyed per COMMIT, and never cancelled. Each commit's verdict stands on its
# own and survives whatever lands after it.

on:
  # Same breadth as ci-macos.yml: a prerelease can be dispatched from any branch,
  # and `mirror-gate` then has nothing to read for that commit — it would wait the
  # full timeout and fail a release that was never actually broken.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The one exception to per-commit keying is a Renovate branch. Its commits are never released (a merge lands as a new
# commit on main, which runs in full), and each rebase replaces the previous commit outright, so an
# older run there only holds a place in a queue that GitHub drains a few macOS jobs at a time.
concurrency:
  group: formula-macos-${{ startsWith(github.ref, 'refs/heads/renovate/') && github.ref || github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  scope:
    name: Does this push need a Mac
    # packaging/macos-scope.sh: a Renovate branch that changes only Linux-side files skips the
    # macOS job below. The run still concludes success, and that is the verdict check-mirror-ci.sh
    # reads for the PR. main, tags and every other branch always run in full.
    # Same fork filter as the macOS job: a same-repo PR's commit is already scoped by its push run.
    if: >-
      ${{ github.server_url == 'https://github.com'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scope is measured from where the branch left main.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: scope
        # An assignment, so a failing script fails this job instead of writing an empty verdict.
        run: |
          scope="$(bash packaging/macos-scope.sh "$GITHUB_REF")"
          echo "macos=$scope" >> "$GITHUB_OUTPUT"

  formula:
    name: Homebrew formula builds and runs (${{ matrix.arch }}, ${{ matrix.tier }})
    # The only other formula check runs inside linuxbrew Docker, so it proves the
    # resource closure and nothing about macOS. That gap shipped a whiskerless-rc
    # whose every command died on `ImportError: ... mis-aligned LINKEDIT string
    # pool` — cryptography's Rust extension, stripped by cargo into a Mach-O dyld
    # refuses. Nothing in CI could see it, because nothing in CI built the formula
    # on a Mac.
    #
    # ci-macos.yml's Apple Silicon lanes, floor and current. Proving the formula on current
    # arm64 alone would leave the macOS floor to be found by a tag, and a tag is immutable by
    # the time it tells you. Killing this workflow's duplicate pull_request run paid for the
    # second lane.
    #
    # No Intel leg: Intel Macs are not supported.
    # A same-repo PR branch already ran on `push` above, and that is the run the release
    # gate reads (check-mirror-ci.sh queries event=push only), so a pull_request run for
    # the same commit decides nothing the gate will ever look at. Fork PRs never fire
    # push in this repository, so for them the pull_request run is the ONLY coverage and
    # has to survive the filter.
    #
    # This is not free, and the cost is worth naming: the two runs are not identical, as
    # `pull_request` checks out the synthetic merge of head into base while `push` checks
    # the head. What is given up is macOS coverage of that merge BEFORE it lands, not of
    # the merged code — `branches: ["**"]` includes main, so the merge commit is tested
    # the moment it arrives. Keeping the PR run instead of the push run is not an option:
    # a prerelease can be dispatched from any branch and the gate would find no
    # event=push run for that commit at all.
    needs: scope
    if: >-
      ${{ github.server_url == 'https://github.com'
      && needs.scope.outputs.macos != 'false'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast: one lane breaking is exactly when the other's verdict matters most,
      # because whether the break is floor-only IS the finding.
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            tier: floor
          - os: macos-26
            arch: arm64
            tier: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - name: Build an sdist from a pristine export
        # Same reason publish.yml exports rather than building in place: hatchling
        # sweeps untracked files, and a stray virtualenv turns a 700 KB sdist into
        # hundreds of megabytes.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          work="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$work"
          (cd "$work" && python -m build --sdist --outdir "$GITHUB_WORKSPACE/dist")
      - name: Install the rendered formula and run it
        # The runner is disposable, which is the condition test-homebrew-formula.sh
        # asks for. It builds cryptography from source — several minutes — which is
        # the entire point: that build is what breaks.
        #
        # The tag has to match the sdist, because the script asserts the installed
        # CLI reports it. That means the STABLE formula is the one exercised here;
        # the rc formula carries a byte-identical dependency and install block, and
        # the Linux smoke covers it at publish time.
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          bash packaging/test-homebrew-formula.sh "v${version}" dist/whiskerless-*.tar.gz
