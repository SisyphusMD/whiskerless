name: Release (macOS pkg)

# The one job that needs a Mac, so it lives on the GitHub mirror (free hosted
# macOS runners). It builds the signed + notarized .pkg and appends it to the
# GitHub + public-Forgejo releases — the only two it can reach. Forgejo's
# publish.yml created those releases (with the Linux binary + notes) and bridges
# the .pkg on to the internal NAS. See packaging/README.md for the secrets.
on:
  push:
    tags: ["v*.*.*"]

# Read by default. Only the job that appends assets to a release gets write, and it holds no
# signing material — so the job that DOES hold the Apple identity cannot write to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build and test signed pkg (${{ matrix.arch }}, macOS 15 floor)
    # Forgejo Actions also reads .github/workflows, but has no macOS runner — so
    # only run on GitHub (server_url is the Forgejo instance URL on Forgejo).
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The FLOOR, not the newest image. This artifact SHIPS: a binary linked on macOS 26 can
          # carry symbols macOS 15 does not have, install cleanly there and then refuse to start —
          # and the install matrix that would notice runs only AFTER publishing. Building on the
          # oldest supported OS makes the artifact runnable across the whole range it claims, and
          # the `current` job below proves it on the newest one before anything is published.
          - os: macos-15
            arch: arm64
          # x86_64 macOS is being sunset by GitHub (~2027); macos-15-intel is the Intel floor.
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # NOT a test runner: PyInstaller freezes this exact interpreter into the shipped .pkg, so
          # it moves with the Linux bundle pin and its reviewed checksum. `depName=python` would
          # collide with Renovate's BUILT-IN github-actions manager, which owns every
          # `python-version:` key and automerges — two owners for one line, one of which could ship
          # a macOS .pkg built on a different Python than the Linux artifacts of the same release.
          # The packageRule in .renovaterc.json disables that built-in owner for this file, leaving
          # the tag dep below as the only one. Same arrangement as the sibling project.
          # renovate: datasource=github-tags depName=python/cpython versioning=pep440
          python-version: "3.14.7"   # exact interpreter frozen into the bundle
      - name: Build the binary
        env:
          # Belt to the floor image's braces: the SDK will happily link against a newer minimum if
          # nothing says otherwise, which is the failure this whole arrangement removes.
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          python -m pip install --upgrade pip
          # PINNED, like the Linux half. An unpinned PyInstaller here means the .pkg and the Linux
          # artifacts of the same release can be frozen by different, unreviewed versions of the one
          # dependency that has already cost this project a release — and nothing would report it.
          # Renovate holds both under the same depName, so they bump in one PR.
          # renovate: datasource=pypi depName=pyinstaller
          python -m pip install pyinstaller==6.22.2
          python -m pip install ".[ble]"
          pyinstaller --onefile --name whiskerless \
            --collect-all bleak --collect-all aiomqtt packaging/launcher.py
      - name: Import signing certificates
        env:
          APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Removed on EXIT, not after the last use: `set -e` would skip a trailing `rm` on any
          # failure above, leaving both private certificates decoded in the workspace — which the
          # later steps then upload from and which a workflow change could publish.
          trap 'rm -f app.p12 installer.p12' EXIT
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APP_CERT_P12" | base64 -d > app.p12
          echo "$INSTALLER_CERT_P12" | base64 -d > installer.p12
          security import app.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security import installer.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
      - name: Sign, package, notarize, staple
        env:
          APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          trap 'rm -f notary.p8' EXIT
          PKG="whiskerless-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.pkg"
          bash packaging/retry.sh 5 codesign --force --options runtime --timestamp \
            --entitlements packaging/entitlements.plist --sign "$APP_IDENTITY" dist/whiskerless
          mkdir -p root/usr/local/bin
          cp dist/whiskerless root/usr/local/bin/whiskerless
          pkgbuild --root root --identifier com.sisyphusmd.whiskerless \
            --version "${GITHUB_REF_NAME#v}" --install-location / unsigned.pkg
          bash packaging/retry.sh 5 productsign --sign "$INSTALLER_IDENTITY" unsigned.pkg "$PKG"
          echo "$NOTARY_KEY_P8" | base64 -d > notary.p8
          bash packaging/retry.sh 5 xcrun notarytool submit "$PKG" \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          bash packaging/retry.sh 5 xcrun stapler staple "$PKG"
      - name: Install the signed package, run it, and remove it
        run: |
          set -euo pipefail
          PKG="whiskerless-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}.pkg"
          # Gatekeeper's own verdict first: `installer` does not enforce notarization, so a
          # successful install proves nothing about whether a user could run it.
          spctl -a -vvv -t install "$PKG" 2>&1 | tee /tmp/spctl.txt
          grep -qi accepted /tmp/spctl.txt
          grep -qi notarized /tmp/spctl.txt \
            || { echo "::error::pkg is signed but NOT notarized"; exit 1; }
          sudo installer -pkg "$PKG" -target /
          bash packaging/installed-smoke.sh /usr/local/bin/whiskerless "${GITHUB_REF_NAME#v}"
          # Left behind, the `current` job would test a binary this runner installed rather than
          # the one it downloaded.
          sudo rm -f /usr/local/bin/whiskerless
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-${{ matrix.arch }}
          path: whiskerless-*-macos-${{ matrix.arch }}.pkg
          # A re-run must not trip over its own earlier attempt's upload.
          overwrite: true

  current:
    name: Test floor-built pkg (${{ matrix.arch }}, macOS 26 current)
    if: ${{ github.server_url == 'https://github.com' }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-${{ matrix.arch }}
          path: .
      - name: Install, exercise, and uninstall the floor-built signed package
        run: |
          set -euo pipefail
          # A separate job, so exactly one .pkg is downloaded here; refuse rather than test an
          # arbitrary one.
          shopt -s nullglob
          pkgs=(*-macos-${{ matrix.arch }}.pkg)
          [ "${#pkgs[@]}" -eq 1 ] || { echo "::error::expected 1 pkg, found ${#pkgs[@]}"; exit 1; }
          sudo installer -pkg "${pkgs[0]}" -target /
          bash packaging/installed-smoke.sh /usr/local/bin/whiskerless "${GITHUB_REF_NAME#v}"
          sudo rm -f /usr/local/bin/whiskerless

  publish:
    name: Append the signed .pkg to the GitHub + Forgejo releases
    if: ${{ github.server_url == 'https://github.com' }}
    needs: [build, current]
    # The only write in this workflow, and it is here rather than at the top because this job
    # holds no signing material: github-release.sh creates the release when it is missing and
    # uploads to it, both of which `contents: read` would 403.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: pkgs
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Wait for the pinned library to exist on PyPI
        # github-release.sh CREATES the release if it is missing, and this workflow is
        # triggered by the tag independently of Forgejo's publish.yml. Without this wait
        # a slow or failed PyPI upload would let HACS offer an update whose manifest pins
        # a version pip cannot install. Shared with release-linux-arm64.yml, which can
        # create the same release for the same reason.
        run: bash packaging/wait-for-pypi.sh "${GITHUB_REF_NAME#v}"
      - name: Append the .pkg to the GitHub + public-Forgejo releases
        run: |
          chmod +x packaging/github-release.sh packaging/forgejo-release.sh
          packaging/github-release.sh "${{ secrets.GITHUB_TOKEN }}" \
            "$GITHUB_REF_NAME" notes.md pkgs/*.pkg
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md pkgs/*.pkg
