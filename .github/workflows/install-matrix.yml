name: Install matrix (macOS + Linux arm64)

# Installs every channel we publish that needs a macOS or an arm64 machine, from
# the PUBLISHED artifacts, and then runs the tool. CI already builds all of this;
# until now it did not install most of it, so the .pkg, a poured bottle, PyPI and
# the apt/dnf repositories were proven by nobody. Each leg ends in
# `packaging/installed-smoke.sh`, which is the single definition of "an installed
# whiskerless works" — adding a channel later means installing it and calling that.
#
# The Linux amd64 half is `.forgejo/workflows/install-matrix.yml`. Architecture
# decides the forge: everything that can run natively on ours does, and what needs
# hardware we do not have runs here on GitHub's. Nothing is emulated on either.
# The rule is in docs/design/ci-split.md and an invariant test enforces it.
#
# It runs AFTER a release by necessity, so it cannot gate the release it tests.
# What it gates is the next STABLE cut: release.yml's `candidate-gate` refuses to
# promote a candidate whose matrix here is anything but green.

# The run-name is load-bearing, not decoration. A tag push carries the tag in
# head_branch, but a DISPATCH is deliberately made from main (so a fix to these
# scripts is what re-runs, not the copies frozen at the tag) and would otherwise
# record nothing about which tag it tested. `candidate-gate` matches on this.
run-name: Install matrix (macOS + Linux arm64) ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*.*.*"]
  # Dispatchable with an explicit tag, the same shape as bottles.yml: when the
  # reason to re-run is a fix to these scripts, a dispatch at the tag would
  # faithfully re-run the old ones.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and test, e.g. v0.2.0-rc.28"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FORGE: https://forgejo.bryantserver.com

jobs:
  # One poll for everyone. Thirteen jobs each waiting on the same release would
  # spend thirteen times the API budget to learn the same fact.
  wait:
    name: Wait for the release to carry everything
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Poll until the release is installable
        id: v
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          bash packaging/wait-for-release.sh "$TAG"

  macos:
    name: macOS installs (${{ matrix.os }})
    needs: wait
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Floor and current, both architectures. The floor is what the bottles
        # are built on and what Homebrew falls back to; the current one is what
        # most people are actually running.
        include:
          - {os: macos-15,       arch: arm64}
          - {os: macos-15-intel, arch: x86_64}
          - {os: macos-26,       arch: arm64}
          - {os: macos-26-intel, arch: x86_64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The signed .pkg — install it, and check it is really notarized
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          DL="$FORGE/SisyphusMD/whiskerless/releases/download/$TAG"
          curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 10 -o /tmp/w.pkg "$DL/whiskerless-${VERSION}-macos-${{ matrix.arch }}.pkg"
          # Gatekeeper's own verdict, before installing. `installer` does not
          # enforce notarization, so installing successfully proves nothing about
          # whether a user double-clicking it would be allowed to.
          spctl -a -vvv -t install /tmp/w.pkg 2>&1 | tee /tmp/spctl.txt
          grep -qi "accepted" /tmp/spctl.txt
          grep -qi "notarized" /tmp/spctl.txt || { echo "::error::pkg is signed but NOT notarized"; exit 1; }
          pkgutil --check-signature /tmp/w.pkg | head -5
          sudo installer -pkg /tmp/w.pkg -target /
          bash packaging/installed-smoke.sh /usr/local/bin/whiskerless "$VERSION"
      - name: The Homebrew bottle — pour it, and prove it was poured
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          # The .pkg put a binary at /usr/local/bin; remove it so the smoke that
          # follows is unambiguously exercising the brew install.
          sudo rm -f /usr/local/bin/whiskerless
          # Baseline first: a hosted image may already ship rust or llvm, and an
          # absolute count would then fail a perfectly good pour.
          before=$(brew list --formula | grep -cE '^rust$|^llvm$|^pkgconf$' || true)
          brew update --quiet >/dev/null 2>&1
          brew tap sisyphusmd/tap "$FORGE/SisyphusMD/homebrew-tap.git" >/dev/null 2>&1
          # Homebrew refuses to LOAD a formula from an untrusted third-party tap, and installing the rc
          # loads the stable one its `conflicts_with` names. Guarded on the subcommand existing: an older
          # Homebrew has no `trust` and needs none, while one that exists and fails must stop the job.
          if brew commands 2>/dev/null | tr ' ' '\n' | grep -qx trust; then brew trust sisyphusmd/tap; fi
          brew install sisyphusmd/tap/whiskerless-rc > /tmp/i.log 2>&1 || { tail -30 /tmp/i.log; exit 1; }
          grep -qi "pouring whiskerless" /tmp/i.log || { echo "::error::built from source instead of pouring"; grep -iE "building" /tmp/i.log | head -5; exit 1; }
          after=$(brew list --formula | grep -cE '^rust$|^llvm$|^pkgconf$' || true)
          [ "$after" -le "$before" ] || { echo "::error::build-only dependencies appeared ($before -> $after) — it compiled"; exit 1; }
          bash packaging/installed-smoke.sh "$(brew --prefix)/bin/whiskerless" "$VERSION"
      - name: PyPI via uvx
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: |
          set -euo pipefail
          brew uninstall --force whiskerless-rc >/dev/null 2>&1 || true
          PYPI_V="$(printf '%s' "$VERSION" | sed -E 's/-rc\.([0-9]+)$/rc\1/')"
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 -o /tmp/uv-install.sh https://astral.sh/uv/install.sh
          # Written to a file, never piped: curl cannot rewind a pipe, so a retried
          # partial body would reach `sh` concatenated with the first attempt's.
          sh /tmp/uv-install.sh >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          printf '#!/bin/sh\nexec uvx -q --from '"'"'whiskerless[ble]==%s'"'"' whiskerless "$@"\n' "$PYPI_V" > /tmp/wskl
          chmod +x /tmp/wskl
          bash packaging/installed-smoke.sh /tmp/wskl "$VERSION"

  # Every Linux channel, on real arm64 silicon. Its amd64 twin runs on Forgejo and
  # calls the SAME script, which is what keeps the two architectures testing the
  # same list of channels rather than two lists that were equal once.
  linux-arm64:
    name: Linux installs (arm64)
    needs: wait
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Needed for `--output type=local`, which the default docker driver does not
      # support. No registry mirror here: that one is on our network, not this one.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Install every Linux channel and smoke each one
        env:
          VERSION: ${{ needs.wait.outputs.version }}
        run: bash packaging/install-matrix-arch.sh arm64

  summary:
    name: Every macOS and Linux arm64 channel installed and ran
    needs: [macos, linux-arm64]
    if: ${{ always() && github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          echo "macos:       ${{ needs.macos.result }}"
          echo "linux-arm64: ${{ needs.linux-arm64.result }}"
          # Both, and named separately: a summary that only reported the worse of the
          # two would say "something is broken" about a matrix whose whole job is to
          # say WHICH thing is.
          bad=""
          [ "${{ needs.macos.result }}" = success ] || bad="$bad macOS"
          [ "${{ needs.linux-arm64.result }}" = success ] || bad="$bad Linux-arm64"
          [ -z "$bad" ] || { echo "::error::install channels are broken for $TAG:$bad"; exit 1; }
