name: CI (macOS)

# Forgejo remains the primary CI authority; its runners are Linux only. This
# supplies the macOS legs, which matter here because the standalone provisioner
# ships as a signed .pkg for both architectures and bleak's Bluetooth backend is
# platform-specific — a macOS-only import or CoreBluetooth path bug would
# otherwise be found by whoever downloaded the .pkg.
#
# Both the OLDEST supported macOS and the CURRENT one, on both architectures:
# `macos-latest` alone silently tracks whatever GitHub last promoted, which is
# the opposite of knowing what the floor is.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.arch }}, ${{ matrix.tier }})
    # Forgejo also reads .github/workflows but has no macOS runner.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            tier: floor
          - os: macos-26
            arch: arm64
            tier: current
          - os: macos-15-intel
            arch: x86_64
            tier: floor
          - os: macos-26-intel
            arch: x86_64
            tier: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ble]"
      - name: Pytest (library)
        # No lint or mypy leg: those are platform-independent and already run on
        # Linux. What is macOS-specific is whether the code imports and runs.
        run: pytest -q
      - name: Import the BLE stack on this platform
        # bleak resolves its backend at import time (CoreBluetooth here, BlueZ on
        # Linux). The suite fakes bleak at the transport boundary, so nothing
        # else proves the real backend loads on the OS the .pkg targets.
        run: python -c "import bleak; from whiskerless.ble.transport import scan; print('bleak backend imports')"

  formula:
    name: Homebrew formula builds and runs (macOS)
    # The only other formula check runs inside linuxbrew Docker, so it proves the
    # resource closure and nothing about macOS. That gap shipped a whiskerless-rc
    # whose every command died on `ImportError: ... mis-aligned LINKEDIT string
    # pool` — cryptography's Rust extension, stripped by cargo into a Mach-O dyld
    # refuses. Nothing in CI could see it, because nothing in CI built the formula
    # on a Mac.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build an sdist from a pristine export
        # Same reason publish.yml exports rather than building in place: hatchling
        # sweeps untracked files, and a stray virtualenv turns a 700 KB sdist into
        # hundreds of megabytes.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          work="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$work"
          (cd "$work" && python -m build --sdist --outdir "$GITHUB_WORKSPACE/dist")
      - name: Install the rendered formula and run it
        # The runner is disposable, which is the condition test-homebrew-formula.sh
        # asks for. It builds cryptography from source — several minutes — which is
        # the entire point: that build is what breaks.
        #
        # The tag has to match the sdist, because the script asserts the installed
        # CLI reports it. That means the STABLE formula is the one exercised here;
        # the rc formula carries a byte-identical dependency and install block, and
        # the Linux smoke covers it at publish time.
        run: |
          set -euo pipefail
          version="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          bash packaging/test-homebrew-formula.sh "v${version}" dist/whiskerless-*.tar.gz
