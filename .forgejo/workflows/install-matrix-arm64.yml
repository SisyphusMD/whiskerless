name: Install matrix (Linux arm64, shadow)

# SHADOW of the arm64 leg of .github/workflows/install-matrix.yml: the same shards, on our own
# native arm64 runner, against the same release. GitHub's run stays the one the next stable cut
# reads until the two have agreed on a release candidate.
#
# Its own workflow, not a job in install-matrix.yml, because the stable gate reads that run's
# overall status: a shard here still queued or still running would hold the gate even though it
# can never fail it. Every shard step that can fail is continue-on-error and the last one reports
# the verdict, so the shards are green whatever they found; read the SHADOW-VERDICT lines. Only the
# wait for the release itself can turn this run red, as it does install-matrix.yml.
#
# Dispatched by publish.yml next to the other two matrices, from main with the tag as an input,
# for the reason install-matrix.yml gives.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and test, e.g. v0.2.0-rc.30"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FORGE: https://forgejo.bryantserver.com

jobs:
  wait:
    # The tag is in the name because this is the only place Forgejo keeps it.
    name: Wait for ${{ inputs.tag || github.ref_name }} to be installable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          bash packaging/wait-for-release.sh "$TAG"
        env:
          # Only this step reads it, so it is not granted to the shard jobs or their actions.
          GITHUB_ASSET_TOKEN: ${{ secrets.GH_REPO_READ_PAT }}

  linux-arm64:
    name: Linux installs (arm64) shard ${{ matrix.shard }}
    needs: wait
    # Four shards, as on GitHub, so the two compare shard for shard.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-26.04-arm
    steps:
      # Even the preparation may not fail this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        continue-on-error: true
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Install every Linux channel and smoke each one
        id: install
        if: steps.buildx.outcome == 'success'
        continue-on-error: true
        env:
          VERSION: ${{ needs.wait.outputs.version }}
          # All four shards share one VM's disk, so each keeps the small ceiling GitHub's had.
          CACHE_CEILING_GB: "4"
          BREW_MIRROR: "https://image-mirror.lan.bryantserver.com"
        run: bash packaging/install-matrix-arch.sh arm64 ${{ matrix.shard }} 4
      - name: Shadow verdict
        if: always()
        env:
          OUTCOME: ${{ steps.checkout.outcome != 'success' && 'checkout-failed' || steps.buildx.outcome != 'success' && 'buildx-failed' || steps.install.outcome }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "SHADOW-VERDICT install-matrix arm64 shard $SHARD: $OUTCOME"
          [ "$OUTCOME" = success ] || echo "::warning::arm64 install shard $SHARD: $OUTCOME (shadow, not gating)"
