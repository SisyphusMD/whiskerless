# PR checks for issue-first repos; main's protection rule requires every called job. The jobs are
# SisyphusMD/project-rules main's gate.yml and gate-lint.yml, so no repo copies the jobs (#78).
# pull_request_target runs this file from main, not from the PR, so a PR cannot change its checks.
# This file keeps what a called workflow cannot: the trigger, the concurrency group and which
# secret the jobs may see. Only this caller is copied. Canonical copy: SisyphusMD/project-rules;
# repos get a copy.
name: CI
on:
  pull_request_target:
    branches: [main]
    # edited: fixing the description re-runs the issue-link check.
    types: [opened, edited, synchronize, reopened]
concurrency:
  # Per PR and event: under pull_request_target github.ref is main for every PR.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  shared-gate:
    uses: SisyphusMD/project-rules/.forgejo/workflows/gate.yml@main
    secrets:
      # read:issue only, for `owner/repo#n`: the job token cannot read other private repos.
      ISSUE_READ_TOKEN: ${{ secrets.ISSUE_READ_TOKEN }}
  shared-lint:
    uses: SisyphusMD/project-rules/.forgejo/workflows/gate-lint.yml@main
