name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test (library, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range: 3.11 is the floor pyproject
        # advertises, and running only the newest interpreter let 3.12-only
        # syntax reach the library unnoticed.
        python-version: ["3.11.0", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ble]"
      - name: Ruff
        run: ruff check src custom_components tests packaging
      - name: Mypy (library, strict)
        run: mypy
      - name: Pytest (library)
        # BLE is faked at the bleak boundary rather than skipped, so the whole
        # library is held to one floor. safety.py is gated separately at 100%
        # because it is the chokepoint every send funnels through.
        run: >-
          pytest -q --cov=whiskerless --cov-report=term-missing
          --cov-config=pyproject.toml --cov-fail-under=98
      - name: Coverage gate (safety chokepoint)
        run: coverage report --include='*/safety.py' --fail-under=100

  dependency-floors:
    name: Test the dependency floors the package advertises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The oldest interpreter pyproject advertises, with the oldest
          # dependencies it advertises — the combination a user on a long-term
          # distro actually gets, and the one nothing else here exercises.
          python-version: "3.11.15"
      - name: Install at the declared minimums
        # `lowest-direct` pins what this project declares (aiomqtt 2.0.0, bleak
        # 0.22.0) while letting their own dependencies resolve normally. A plain
        # `lowest` would also floor transitive packages, which this project does
        # not claim to support and cannot fix.
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[dev,ble]"
      - name: Pytest (library, at the floors)
        # No coverage gate: this job answers "does the advertised minimum work",
        # and the ceiling jobs already hold the line on coverage.
        run: pytest -q

  homeassistant:
    name: Type-check + test the integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test-ha]"
      - name: Mypy (integration, strict)
        # --python-version 3.13: the integration uses PEP 695 syntax (HA runs 3.13);
        # override pyproject's 3.11 library pin so the type alias / generic defs parse.
        # --namespace-packages --explicit-package-bases: check it as
        # custom_components.whiskerless so `from whiskerless import …` resolves to the
        # installed library, not the same-named integration package (matches runtime).
        run: >-
          mypy --strict --python-version 3.13 --namespace-packages
          --explicit-package-bases custom_components/whiskerless
      - name: Pytest (integration)
        # The quality scale asks for two different numbers, so they are two gates:
        # the package above 95% (test-coverage) and the config flow at exactly 100%
        # (config-flow-test-coverage), which averaging into one threshold would hide.
        run: pytest tests/integration --cov --cov-report=term-missing --cov-fail-under=95
      - name: Coverage gate (config flow)
        run: coverage report --include='custom_components/whiskerless/config_flow.py' --fail-under=100
