name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  # Forgejo has no rerun API and no equivalent of GitHub's retry-infra-failures
  # workflow, so without this a transient runner fault — `actions/setup-python`
  # failing to fetch its versions manifest took all five jobs down on
  # 2026-08-17 — leaves main red with no way back except an unrelated commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test (library, ${{ matrix.python-version }})
    # Trusted-ref gate: this Forgejo runner is self-hosted, and `pull_request` fires for
    # forks too, so without this a fork's PR would run its own code — and reach this
    # machine's secrets and caches — on the owner's hardware. Fork PRs are covered by
    # GitHub's hosted runners instead (.github/workflows/ci-pr.yml). Ported from dreame-valetudo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range: 3.11 is the floor pyproject
        # advertises, and running only the newest interpreter let 3.12-only
        # syntax reach the library unnoticed.
        python-version: ["3.11.0", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ble]"
      - name: Ruff
        # Every tracked .py, matching the sibling. Naming directories meant scripts/ was
        # linted by nobody — a file is covered because it is in the repo, not because
        # someone remembered to add its directory here.
        run: ruff check $(git ls-files '*.py' | tr '\n' ' ')
      - name: Mypy (library, strict)
        run: mypy
      - name: Pytest (library)
        # BLE is faked at the bleak boundary rather than skipped, so the whole
        # library is held to one floor. safety.py is gated separately at 100%
        # because it is the chokepoint every send funnels through.
        run: >-
          pytest -q --cov=whiskerless --cov-report=term-missing
          --cov-config=pyproject.toml --cov-fail-under=99
      - name: Coverage gate (safety chokepoint)
        run: coverage report --include='*/safety.py' --fail-under=100

  hygiene:
    name: Shell scripts and documentation links
    # Trusted-ref gate: this Forgejo runner is self-hosted, and `pull_request` fires for
    # forks too, so without this a fork's PR would run its own code — and reach this
    # machine's secrets and caches — on the owner's hardware. Fork PRs are covered by
    # GitHub's hosted runners instead (.github/workflows/ci-pr.yml). Ported from dreame-valetudo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_2
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_2.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Shellcheck
        # The release path is shell scripts that only run during a release, so
        # a mistake in one surfaces while cutting it rather than in review. ruff
        # already covers packaging's Python; this covers the rest.
        #
        # The pinned image and the docker create/cp/start dance live in the shared script so the
        # release gates below run the identical check — see packaging/shellcheck-all.sh.
        run: bash packaging/shellcheck-all.sh
      - name: Release-script integration (curl stubbed, no network)
        # The release publishers are the code with the least margin for error and the fewest
        # chances to catch a mistake: they run once, during a release, against three live
        # registries. Until this existed they were shellcheck'd and never executed.
        #
        # `tests/release/`, not `tests/integration/` — the latter is this project's Home Assistant
        # test package, and the sibling project uses the same directory name for shell tests.
        # Same word, two meanings, so both now say `release` for this.
        run: |
          set -euo pipefail
          # `build`, so release-scripts.sh exercises the tap section instead of skipping it. That
          # file runs offline by contract, so it never installs this itself, and the skip is quiet:
          # the section prints SKIPPED and the suite still passes.
          python3 -m pip install --upgrade build
          for t in tests/release/*.sh; do echo "== $t =="; bash "$t"; done

      - name: Documentation links
        # Relative links rot silently: a doc moves and the link keeps rendering,
        # just pointing at nothing. The setup guide alone links to the recovery
        # guide, the compatibility notes and the examples directory.
        run: python3 packaging/check-doc-links.py .

      - name: Vendored standard has not drifted
        # A shared helper improved by editing the copy here never reaches the sibling project —
        # which is how these two drifted apart in the first place. Change it in project-standard,
        # re-vendor both, land them together.
        run: python3 packaging/check-standard-sync.py

      - name: .gitignore contains the shared base
        run: python3 packaging/check-gitignore-base.py .

      - name: Cited external sources still resolve
        # Only the pages we relied ON as evidence — Whisker's control-panel
        # article behind docs/devices/litter-robot-4/control-panel.md, and the
        # brands announcement behind shipping our own images. If one moves, the
        # claim it supports has no way back to its source. Retries inside, so a
        # vendor's transient 5xx does not fail the build.
        run: bash packaging/check-external-links.sh

  dependency-floors:
    name: Test the dependency floors the package advertises
    # Trusted-ref gate: this Forgejo runner is self-hosted, and `pull_request` fires for
    # forks too, so without this a fork's PR would run its own code — and reach this
    # machine's secrets and caches — on the owner's hardware. Fork PRs are covered by
    # GitHub's hosted runners instead (.github/workflows/ci-pr.yml). Ported from dreame-valetudo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_3
        continue-on-error: true
        with:
          # The oldest interpreter pyproject advertises, with the oldest
          # dependencies it advertises — the combination a user on a long-term
          # distro actually gets, and the one nothing else here exercises.
          python-version: "3.11.0"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_3.outcome != 'success'
        with:
          # The oldest interpreter pyproject advertises, with the oldest
          # dependencies it advertises — the combination a user on a long-term
          # distro actually gets, and the one nothing else here exercises.
          python-version: "3.11.0"
      - name: Install at the declared minimums
        # `lowest-direct` pins what this project declares (aiomqtt 2.0.0, bleak
        # 0.22.0) while letting their own dependencies resolve normally. A plain
        # `lowest` would also floor transitive packages, which this project does
        # not claim to support and cannot fix.
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[dev,ble]"
      - name: Pytest (library, at the floors)
        # No coverage gate: this job answers "does the advertised minimum work",
        # and the ceiling jobs already hold the line on coverage.
        run: pytest -q

  homeassistant:
    name: Type-check + test the integration
    # Trusted-ref gate: this Forgejo runner is self-hosted, and `pull_request` fires for
    # forks too, so without this a fork's PR would run its own code — and reach this
    # machine's secrets and caches — on the owner's hardware. Fork PRs are covered by
    # GitHub's hosted runners instead (.github/workflows/ci-pr.yml). Ported from dreame-valetudo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_4
        continue-on-error: true
        with:
          python-version: "3.13"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_4.outcome != 'success'
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # NOT `[dev,test-ha]`. The HA harness pins pytest, pytest-asyncio and pytest-cov to
          # exact versions of its own, and `dev` pins the same three exactly — so asking for both
          # extras is unsatisfiable and pip fails before a single check runs. The harness owns the
          # test toolchain in this environment; the only thing `dev` still has to contribute is
          # the type-checker, read from pyproject so it cannot drift from the library job's.
          MYPY=$(grep -oE '"mypy==[0-9][0-9a-zA-Z.+-]*"' pyproject.toml | tr -d '"' | head -1)
          test -n "$MYPY"
          python -m pip install -e ".[test-ha]" "$MYPY"
      - name: Mypy (integration, strict)
        # --python-version 3.13: the integration uses PEP 695 syntax (HA runs 3.13);
        # override pyproject's 3.11 library pin so the type alias / generic defs parse.
        # --namespace-packages --explicit-package-bases: check it as
        # custom_components.whiskerless so `from whiskerless import …` resolves to the
        # installed library, not the same-named integration package (matches runtime).
        run: >-
          mypy --strict --python-version 3.13 --namespace-packages
          --explicit-package-bases custom_components/whiskerless
      - name: Pytest (integration)
        # Two gates, because averaging them into one would hide either. This
        # project holds every suite at 99%; the quality scale only asks for 95%
        # (test-coverage), and the config flow is a separate 100%
        # (config-flow-test-coverage).
        run: pytest tests/integration --cov --cov-report=term-missing --cov-fail-under=99
      - name: Coverage gate (config flow)
        run: coverage report --include='custom_components/whiskerless/config_flow.py' --fail-under=100

  # Compile-check the RELEASE path, on every push — the sibling has carried this for months and it
  # is what catches a packaging break before a tag rather than during one. Nothing else here builds
  # linux.Dockerfile, runs nfpm, or installs the Homebrew formula, so before this the first
  # execution of any of them was a published release candidate.
  #
  # Unsigned on purpose: build-linux-arch.sh fails closed without GPG_SIGNING_KEY, and this job
  # holds no credential. It calls the same Dockerfile and the same nfpm.yaml that a release does,
  # which is where the breakages live; signing is exercised at release time.
  build:
    name: Compile-check the release path (bundle, packages, formula)
    # trusted-ref gate, the same one the other jobs use: do not build and run PR-supplied code on
    # the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The formula smoke builds an sdist from a pristine export, and hatchling needs the tag
          # history to stamp a version.
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub-mirror.nas.bryantserver.com"]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_build_1
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_build_1.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Freeze the bundle and package it (the release-time dependencies)
        run: |
          set -euo pipefail
          # The same pins a release builds with, from the same file.
          # shellcheck source=/dev/null
          . packaging/release-pins.env
          # amd64 only: this runner is amd64 and nothing here is emulated. The arm64 leg builds
          # natively on GitHub at release time.
          rm -rf out
          docker buildx build --platform linux/amd64 \
            --build-arg PYTHON_BUILD_IMAGE="$MANYLINUX_AMD64" \
            --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
            --build-arg PYTHON_SHA256="$PYTHON_SHA256" \
            --build-arg PYINSTALLER="$PYINSTALLER" \
            -f packaging/linux.Dockerfile --target export --output type=local,dest=out .
          rm -rf dist && mkdir dist
          cp out/whiskerless dist/whiskerless
          # nfpm.yaml ships the man page gzipped, and build-linux-arch.sh generates it just before
          # packaging — so it is not in the tree and nfpm fails on a missing file without this.
          # -n so the gzip header carries no timestamp: the package stays byte-reproducible.
          gzip -9 -n -c packaging/whiskerless.1 > packaging/whiskerless.1.gz
          # A throwaway version: this proves nfpm.yaml still describes a buildable package, not
          # that any particular release is correct. Unsigned, so no key is needed.
          #
          # The container is removed on EVERY exit path. This runner's Docker daemon is the
          # persistent host one, so letting `set -e` skip the cleanup when nfpm rejects a broken
          # nfpm.yaml would leave a container behind on each failing run — and the runs that fail
          # here are exactly the ones somebody re-runs while fixing it.
          cid=""
          trap 'test -z "$cid" || docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          package() { # package <deb|rpm>
            local fmt="$1"
            cid=$(docker create -e ARCH=amd64 -e VERSION=0.0.0-rc.1 -w /w "$NFPM" \
              package -p "$fmt" -f packaging/nfpm.yaml -t "/w/ci.$fmt")
            docker cp . "$cid":/w >/dev/null
            docker start -a "$cid"
            docker cp "$cid":"/w/ci.$fmt" . >/dev/null
            docker rm -f "$cid" >/dev/null
            cid=""
          }
          package deb
          package rpm
          ls -l ci.deb ci.rpm

      - name: Install both packages in real distro userspaces and run the binary
        run: |
          set -euo pipefail
          # Building a package only proves nfpm accepted nfpm.yaml. What a layout mistake breaks is
          # the INSTALL — a binary landing somewhere not on PATH, a missing dependency, a maintainer
          # script that exits non-zero — and none of that shows up until something installs it. The
          # same two Dockerfiles the release path smokes with, on the packages just built here.
          smoke() { # smoke <deb|rpm> <dockerfile>
            # package-smoke-* so the same .gitignore line covers these and the release build's.
            local fmt="$1" dockerfile="$2" result="package-smoke-$1-ci"
            cp "ci.$fmt" "package-smoke.$fmt"
            rm -rf "$result"
            docker buildx build --platform linux/amd64 \
              -f "$dockerfile" --target result --output "type=local,dest=$result" .
            test -f "$result/package-smoke-passed"
            rm -f "package-smoke.$fmt"
          }
          smoke deb packaging/package-smoke.Dockerfile
          smoke rpm packaging/package-smoke-rpm.Dockerfile
      - name: Install the Homebrew formula for real, and run it
        run: |
          set -euo pipefail
          # A real `brew install` of the rendered formula. Nothing cheaper catches a formula that
          # installs to the wrong place — the install block is Ruby, and it only runs here.
          python -m pip install --quiet --upgrade pip build
          # From a pristine export, like update-tap.sh: hatchling sweeps untracked files beside the
          # source into the sdist, which must not change what the smoke installs.
          work="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$work"
          python -m build --sdist --outdir "$work/dist" "$work" >/dev/null
          mkdir -p formula-smoke-dist
          cp "$work"/dist/whiskerless-*.tar.gz formula-smoke-dist/
          # The tag SPELLING, derived from pyproject rather than from the sdist filename: the
          # filename is PEP 440 (0.2.0rc1) and test-homebrew-formula.sh takes the tag grammar
          # (v0.2.0-rc.1), converting it back itself. Passing the filename form would be refused.
          ver=$(python -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")
          tag="v$(printf '%s' "$ver" | sed -E 's/rc([0-9]+)$/-rc.\1/')"
          rm -rf homebrew-smoke-result
          docker buildx build --platform linux/amd64 --build-arg TEST_TAG="$tag" \
            --build-arg BREW_MIRROR="https://image-mirror.nas.bryantserver.com" \
            -f packaging/homebrew-smoke.Dockerfile --target result \
            --output type=local,dest=homebrew-smoke-result .
          test -f homebrew-smoke-result/homebrew-smoke-passed
          echo "build OK: frozen bundle, .deb + .rpm installed and run, and a real Linuxbrew formula install"

  macos:
    # By the time the Linux suites finish, the mirrored macOS workflow normally has too. This keeps
    # the shared public GitHub API budget and the self-hosted runner slot out of a needless poll.
    needs: [quality, hygiene, dependency-floors, homeassistant, build]
    # GitHub's mirror runs the same commit on native arm64 and Intel hosts. Waiting by exact head
    # SHA prevents a newer green branch run from qualifying an older pull request revision.
    #
    # NOT on a tag. A prerelease stamps a fresh `prerelease:` commit and pushes only the tag, so that
    # commit is reachable from nothing else - while ci-macos.yml runs on branch pushes, which a tag
    # is not. There can never be a run to wait for, so this would poll to its timeout and fail every
    # prerelease. The commit it was stamped onto was already gated: prerelease.yml requires the same
    # macOS verdict for the SOURCE sha before it authorizes the tag at all.
    if: >-
      (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The step below runs a script from this checkout against a PR-controlled ref; leaving the
          # repository token in git config would hand that script a WRITE credential the job has no
          # use for. The release mirror gate withholds it for the same reason.
          persist-credentials: false
      - name: Resolve the mirrored commit
        id: mirrored
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            sha=$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["pull_request"]["head"]["sha"])')
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require native macOS CI for this exact commit
        env:
          # Optional and read-only. Unauthenticated GitHub allows 60 requests an hour PER IP, shared
          # with everything else egressing from this network — including the sibling repository's
          # copy of this same gate, which polls the same API for the same reason. A token needs NO
          # scopes for a public repo and lifts the limit to 5,000/hour; exhausting it turns this gate
          # into a timeout that blames the mirror for a commit nothing was wrong with. The job holds
          # no WRITE credential either way, which is the property that matters.
          MIRROR_CI_TOKEN: ${{ secrets.GH_REPO_READ_PAT }}
        # Only the fast macOS matrix, not the formula build: this decides whether CI may call itself
        # green, and the release gates separately require the formula job before a tag is allowed.
        run: bash packaging/check-mirror-ci.sh "${{ steps.mirrored.outputs.sha }}" .github/workflows/ci-macos.yml
