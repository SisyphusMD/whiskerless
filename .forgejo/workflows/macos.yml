name: macOS

# The native macOS legs, each in its own VM on our own Mac: the oldest supported macOS (15) and the
# newest (27). They run the test suite and the Homebrew formula smoke on every pushed commit, and
# both jobs are required checks on main. The release workflows refuse a commit whose run here is not
# fully green (packaging/check-forgejo-ci.sh). Renovate merges by itself and waits for every status,
# so while a VM is down, Renovate's merges wait for it.
#
# Push to every branch: a prerelease can be cut from any branch, and its gate needs a verdict for
# that exact commit. No pull_request trigger: a same-repository branch already runs on push, and an
# outside pull request's code must not run on these machines.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Keyed per commit and never cancelled, because the gates read one verdict per SHA; except on a
# Renovate branch, whose commits are never released and are replaced by each rebase.
concurrency:
  group: macos-${{ startsWith(github.ref, 'refs/heads/renovate/') && github.ref || github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/renovate/') }}

jobs:
  scope:
    name: Does this push need a Mac
    # packaging/macos-scope.sh: a Renovate branch that changes only Linux-side files skips the
    # macOS job below; main, tags and every other branch always run in full.
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scope is measured from where the branch left main.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: scope
        run: |
          scope="$(bash packaging/macos-scope.sh "$GITHUB_REF")"
          echo "macos=$scope" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.tier }} (${{ matrix.runner }})
    needs: scope
    if: needs.scope.outputs.macos != 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-vm
            tier: floor
          - runner: macos-27-vm
            tier: current
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The formula smoke builds an sdist, and hatchling needs the tag history for a version.
          fetch-depth: 0
          persist-credentials: false
      # Retried in-step: a transient versions-manifest fetch failure is the commonest way this job
      # dies before testing anything, and Forgejo has no automatic retry.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.15.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.15.2"
      # First, while the VM is as clean as a user's Mac: the VM checks itself against its image
      # before every job, and the test dependencies below would otherwise already be installed.
      - name: Homebrew formula builds and runs
        id: formula
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          # From a pristine export: hatchling sweeps untracked files beside the source into the sdist.
          work="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$work"
          (cd "$work" && python -m build --sdist --outdir "$GITHUB_WORKSPACE/dist")
          version="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          bash packaging/test-homebrew-formula.sh "v${version}" dist/whiskerless-*.tar.gz
      - name: Install native test dependencies
        id: deps
        run: |
          brew install bash shellcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ble]"
      - name: Lint and type-check
        id: lint
        run: |
          ruff check $(git ls-files '*.py' | tr '\n' ' ')
          mypy
      - name: Pytest (library)
        id: pytest
        run: pytest -q
      - name: Check shell scripts
        id: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck
      - name: Run the release scripts' tests on BSD userland
        id: release_scripts
        run: |
          for t in tests/release/*.sh; do
            echo "== $t =="
            bash "$t"
          done
      - name: Import the BLE stack on this platform
        id: ble
        run: python -c "import bleak; from whiskerless.ble.transport import scan; print('bleak backend imports')"
