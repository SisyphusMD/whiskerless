# Nightly export of issues, PRs, comments and reviews to the issue-archive branch.
# Push mirrors carry git only; this branch is how issue history reaches the backup mirror.
# The job is SisyphusMD/project-rules main's archive.yml, so no repo copies the job or its script
# (SisyphusMD/project-rules#144). This file keeps what a called workflow cannot: the schedule, the
# concurrency group and which secret the job may see. Canonical copy: SisyphusMD/project-rules;
# repos get a copy.
name: Issue archive
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
concurrency:
  group: issue-archive
  cancel-in-progress: false
jobs:
  shared-archive:
    uses: SisyphusMD/project-rules/.forgejo/workflows/archive.yml@main
    secrets:
      # Read-only on the owner's .project-rules, for the archive's committer address.
      PROJECT_RULES_TOKEN: ${{ secrets.PROJECT_RULES_TOKEN }}
