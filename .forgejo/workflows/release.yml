name: Release

# Cut a stable release from main: pick the bump in the Forgejo UI. This advances the CHANGELOG,
# bumps every version string, runs the test gate, then commits + tags. The tag triggers publish.yml
# (PyPI + Linux binary + the forgejo/nas/github releases) and, on the GitHub mirror, the macOS .pkg
# job. For a build to put on hardware first, use prerelease.yml instead.
#
# Split in two: `gate` decides what the release IS and proves the tree is green while holding no
# credential; `tag` is the only job handed the write token, and it re-derives the same stamp from a
# fresh checkout and refuses to push unless the bytes hash to what the gate qualified.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  # Shared with prerelease.yml: stable and rc tag creation must not interleave, or both derive
  # from the same base and an rc can land after the stable it was a candidate for.
  group: release-cut
  cancel-in-progress: false

jobs:
  gate:
    name: Qualify release intent (secret-free)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      date: ${{ steps.ver.outputs.date }}
      intent_sha256: ${{ steps.intent.outputs.sha256 }}
    steps:
      - name: Refuse non-main dispatches
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Release must be dispatched from main; got '${{ github.ref_name }}'"
            exit 1
          fi

      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # next-version.sh ignores -rc tags when picking the base, so an outstanding release
          # candidate cannot drag the next stable version along with it.
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Decided ONCE here: the tag job reproduces the gate's patch byte for
          # byte, so a second `date -u` across UTC midnight would abort a
          # perfectly good release on a hash mismatch.
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (bump=${BUMP}, previous=${previous:-none})"

      - name: Sanity guards
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          grep -qE '^## \[Unreleased\]' CHANGELOG.md || { echo "::error::Missing '## [Unreleased]'"; exit 1; }
          ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md || { echo "::error::CHANGELOG already has [${VERSION}]"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || { echo "::error::Tag ${TAG} exists"; exit 1; }

      - name: Promote [Unreleased] in CHANGELOG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DATE: ${{ steps.ver.outputs.date }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" -v date="$DATE" '
            /^## \[Unreleased\]/ {
              print "## [Unreleased]"; print ""; print "## [" ver "] - " date; next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Stamp the version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 packaging/stamp-version.py "$VERSION"
          python3 packaging/stamp-version.py "$VERSION" --check

      - name: Snapshot the exact intended release diff
        id: intent
        run: |
          set -euo pipefail
          # The release edit is exactly these five files and nothing else. Hashing the patch here,
          # before any third-party tool is installed, is what the tag job reproduces byte-for-byte.
          # README.md is stable-only: the stamper leaves it alone for an rc, because the download
          # filenames it carries must name the release people are told to install.
          printf '%s\n' CHANGELOG.md README.md custom_components/whiskerless/manifest.json pyproject.toml \
            src/whiskerless/__init__.py | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --binary > "$RUNNER_TEMP/intended-release.patch"
          sha256sum "$RUNNER_TEMP/intended-release.patch" \
            | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Test gate (library)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ble]"
          ruff check src custom_components tests packaging
          mypy
          # The same coverage floors ci.yml holds — without them a coverage
          # regression could pass the release gate and only go red after the tag.
          pytest -q --cov=whiskerless --cov-report=term-missing --cov-config=pyproject.toml --cov-fail-under=99
          coverage report --include='*/safety.py' --fail-under=100
          python -c "import whiskerless, sys; sys.exit(0 if whiskerless.__version__ == '${VERSION}' else 1)"

      - name: Prove the test toolchain changed no release byte
        run: |
          set -euo pipefail
          git diff --binary | cmp - "$RUNNER_TEMP/intended-release.patch"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

  integration-gate:
    name: Qualify the integration (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      # Plain `mypy` and `pytest` cover the LIBRARY only — conftest auto-skips tests/integration
      # when Home Assistant is absent — so without this job an integration regression could reach
      # HACS with a green release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_2
        continue-on-error: true
        with:
          python-version: "3.13"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_2.outcome != 'success'
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test-ha]"
      - name: Mypy (integration, strict)
        run: >-
          mypy --strict --python-version 3.13 --namespace-packages
          --explicit-package-bases custom_components/whiskerless
      - name: Pytest (integration)
        run: pytest tests/integration --cov --cov-report=term-missing --cov-fail-under=99
      - name: Coverage gate (config flow)
        run: coverage report --include='custom_components/whiskerless/config_flow.py' --fail-under=100

  mirror-gate:
    name: Qualify the mirror's macOS checks on the source commit (no write credential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the mirror's macOS checks to be green on the source commit
        # This forge has no macOS runner, so nothing here can build the Homebrew
        # formula on a Mac — and that build is the one that broke, silently, for a
        # whole release candidate. The mirror runs it; this makes the release wait
        # for its verdict instead of assuming one.
        #
        # The SOURCE commit, deliberately, not the tagged one: the tag job stamps
        # version strings and commits, so the tagged tree is a child of this SHA —
        # and for a prerelease that child is never pushed to a branch, so no branch
        # workflow can ever evaluate it. What makes gating the parent sound is the
        # intent check below, which already refuses unless the working tree differs
        # by exactly the version-stamped files. None of those is the formula, or any
        # code the formula compiles.
        #
        # Unauthenticated on purpose: the gate jobs hold no credential by design,
        # and the mirror is public.
        env:
          # Optional and read-only. Unauthenticated GitHub allows 60 requests an
          # hour PER IP, shared with everything else egressing from this network —
          # exhaust it and the gate polls uselessly and then fails a release that
          # was never broken. A token needs NO scopes for a public repo and lifts
          # the limit to 5,000/hour. Absent, the script still works, just slowly.
          # This job still holds no WRITE credential, which is the property that
          # matters: it cannot push anything.
          MIRROR_CI_TOKEN: ${{ secrets.GH_REPO_READ_PAT }}
        run: bash packaging/check-mirror-ci.sh "${{ github.sha }}"

  candidate-gate:
    name: Qualify the candidate this release promotes (no write credential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # next-version.sh derives the version from the TAGS. A default shallow
          # checkout has none, so it would fall back to 0.0.0, ask about a version
          # that has no candidates, and report "nothing to check" — a gate that
          # passes hardest exactly when it is broken.
          fetch-depth: 0
          persist-credentials: false
      - name: Require the last rc's install matrix to be green
        # The install matrix installs PUBLISHED artifacts, so it can only ever run
        # after a release and can never gate the one it tests. This is where it
        # earns its keep: a candidate whose apt, dnf, Homebrew, .pkg, raw-binary or
        # PyPI install is broken must not become the stable, and noticing that
        # should not depend on somebody remembering to open the right tab.
        #
        # Reads only, like mirror-gate beside it, and takes the same optional
        # read-only token for the same rate-limit reason.
        env:
          GH_REPO_READ_PAT: ${{ secrets.GH_REPO_READ_PAT }}
        run: |
          set -euo pipefail
          # Belt to fetch-depth's braces: if the tags did not arrive, every
          # version this could compute is fiction.
          git tag -l 'v*.*.*' | grep -q . || { echo "::error::no tags in this checkout"; exit 1; }
          version="$(bash packaging/next-version.sh "${{ inputs.bump }}" | sed -n 's/^version=//p')"
          [ -n "$version" ] || { echo "::error::could not compute the version being promoted"; exit 1; }
          bash packaging/check-rc-install-matrix.sh "$version"

  tag:
    name: Authorize and push the release
    needs: [gate, integration-gate, mirror-gate, candidate-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout with no persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce the qualified release intent
        env:
          BUMP: ${{ inputs.bump }}
          QUALIFIED_VERSION: ${{ needs.gate.outputs.version }}
          QUALIFIED_TAG: ${{ needs.gate.outputs.tag }}
          QUALIFIED_DATE: ${{ needs.gate.outputs.date }}
          QUALIFIED_INTENT_SHA256: ${{ needs.gate.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          # Same derivation as the gate, on a tree no gate step ever touched. Nothing here trusts
          # the gate beyond the version and the hash it has to match.
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP")
          [ "$version" = "$QUALIFIED_VERSION" ] && [ "$tag" = "$QUALIFIED_TAG" ] \
            || { echo "::error::qualified release intent changed between runners"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          awk -v ver="$version" -v date="$QUALIFIED_DATE" '
            /^## \[Unreleased\]/ {
              print "## [Unreleased]"; print ""; print "## [" ver "] - " date; next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md
          python3 packaging/stamp-version.py "$version"
          python3 packaging/stamp-version.py "$version" --check
          printf '%s\n' CHANGELOG.md README.md custom_components/whiskerless/manifest.json pyproject.toml \
            src/whiskerless/__init__.py | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          ACTUAL_INTENT_SHA256=$(git diff --binary | sha256sum | awk '{print $1}')
          [ "$ACTUAL_INTENT_SHA256" = "$QUALIFIED_INTENT_SHA256" ] \
            || { echo "::error::release bytes differ from the qualified intent"; exit 1; }

      - name: Commit and tag the reproduced release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add CHANGELOG.md README.md pyproject.toml src/whiskerless/__init__.py \
            custom_components/whiskerless/manifest.json
          git commit -m "release: ${VERSION}"
          python3 packaging/stamp-version.py "$VERSION" --check
          git tag -a -m "release: ${VERSION}" "$TAG"

      - name: Push the release commit and tag
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${TOKEN}@forgejo.bryantserver.com/SisyphusMD/whiskerless.git"
          # Branch first: a tag that exists without the commit on main is the harder state to
          # recover from, because publish.yml starts building the moment the tag lands.
          git push "$REMOTE" "HEAD:${{ github.ref_name }}"
          git push "$REMOTE" "refs/tags/${TAG}"
