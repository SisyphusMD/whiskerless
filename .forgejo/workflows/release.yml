name: Prepare Release

# The qualification jobs hold no write credential. The prepare job reproduces
# the qualified tree before opening the release PR.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [patch, minor, major]
      issue:
        description: "Forgejo release issue number"
        required: true
        type: string

concurrency:
  # Shared with prerelease.yml: stable and rc tag creation must not interleave, or both derive
  # from the same base and an rc can land after the stable it was a candidate for.
  group: release-cut
  cancel-in-progress: false

jobs:
  gate:
    name: Qualify release intent (secret-free)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      date: ${{ steps.ver.outputs.date }}
      intent_sha256: ${{ steps.intent.outputs.sha256 }}
    steps:
      - name: Validate dispatch inputs
        env:
          RELEASE_REF: ${{ github.ref }}
          ISSUE: ${{ inputs.issue }}
        run: |
          if ! [[ "$RELEASE_REF" == refs/heads/main && "$ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Dispatch from main with a numeric release issue"
            exit 1
          fi

      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Shellcheck every shipped and integration script
        run: bash packaging/shellcheck-all.sh

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # next-version.sh ignores -rc tags when picking the base, so an outstanding release
          # candidate cannot drag the next stable version along with it.
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Decided ONCE here: the tag job reproduces the gate's patch byte for
          # byte, so a second `date -u` across UTC midnight would abort a
          # perfectly good release on a hash mismatch.
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"   # range base for the dependency-bump notes
          echo "Releasing ${version} (bump=${BUMP}, previous=${previous:-none})"

      - name: Sanity guards
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          grep -qE '^## \[Unreleased\]' CHANGELOG.md || { echo "::error::Missing '## [Unreleased]'"; exit 1; }
          ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md || { echo "::error::CHANGELOG already has [${VERSION}]"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || { echo "::error::Tag ${TAG} exists"; exit 1; }

      - name: Detect dependency bumps since the previous release (latest per dep)
        id: deps
        env:
          PREV: ${{ steps.ver.outputs.previous }}
        run: |
          set -euo pipefail
          DEPS=$(bash packaging/dependency-bumps.sh "$PREV")
          if [ -z "$PREV" ]; then
            echo "first release — no dependency-update notes"
          else
            echo "dependency bumps to note:"; echo "${DEPS:-<none>}"
          fi
          {
            echo 'deps<<DEPS_EOF'
            [ -n "$DEPS" ] && echo "$DEPS"
            echo 'DEPS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Promote [Unreleased] in CHANGELOG (+ append the dependency bumps)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEPS: ${{ steps.deps.outputs.deps }}
          DATE: ${{ steps.ver.outputs.date }}
        run: bash packaging/promote-changelog.sh "$VERSION" "$DATE"

      - name: Stamp the version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 packaging/stamp-version.py "$VERSION"
          python3 packaging/stamp-version.py "$VERSION" --check

      - name: Snapshot the exact intended release diff
        id: intent
        run: |
          set -euo pipefail
          # The release edit is exactly these five files and nothing else. Hashing the patch here,
          # before any third-party tool is installed, is what the tag job reproduces byte-for-byte.
          # README.md is stable-only: the stamper leaves it alone for an rc, because the download
          # filenames it carries must name the release people are told to install.
          printf '%s\n' CHANGELOG.md README.md custom_components/whiskerless/manifest.json pyproject.toml \
            src/whiskerless/__init__.py | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --binary > "$RUNNER_TEMP/intended-release.patch"
          sha256sum "$RUNNER_TEMP/intended-release.patch" \
            | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.15.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.15.2"
      - name: Test gate (library)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ble]"
          ruff check $(git ls-files '*.py' | tr '\n' ' ')
          mypy
          # The same coverage floors tests.yml holds — without them a coverage
          # regression could pass the release gate and only go red after the tag.
          pytest -q --cov=whiskerless --cov-report=term-missing --cov-config=pyproject.toml --cov-fail-under=99
          coverage report --include='*/safety.py' --fail-under=100
          python -c "import whiskerless, sys; sys.exit(0 if whiskerless.__version__ == '${VERSION}' else 1)"
          # The release scripts get the same integration suite tests.yml runs. Without it the rc
          # sweep and the release helpers are only ever proven on a branch, never on the commit
          # being tagged. The sibling gates on this too.
          # `build`, so release-scripts.sh exercises the tap section instead of skipping it.
          # project-rules conventions/shell-and-workflows.md, section 4: a gate that only really runs
          # in tests.yml does not constrain a release.
          python3 -m pip install --upgrade build
          for t in tests/release/*.sh; do bash "$t"; done

      - name: Prove the test toolchain changed no release byte
        run: |
          set -euo pipefail
          git diff --binary | cmp - "$RUNNER_TEMP/intended-release.patch"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

  integration-gate:
    name: Qualify the integration (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      # Plain `mypy` and `pytest` cover the LIBRARY only — conftest auto-skips tests/integration
      # when Home Assistant is absent — so without this job an integration regression could reach
      # HACS with a green release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_2
        continue-on-error: true
        with:
          python-version: "3.13.18"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_2.outcome != 'success'
        with:
          python-version: "3.13.18"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # NOT `[dev,test-ha]`. The HA harness pins pytest, pytest-asyncio and pytest-cov to
          # exact versions of its own, and `dev` pins the same three exactly — so asking for both
          # extras is unsatisfiable and pip fails before a single check runs. The harness owns the
          # test toolchain in this environment; the only thing `dev` still has to contribute is
          # the type-checker, read from pyproject so it cannot drift from the library job's.
          MYPY=$(grep -oE '"mypy==[0-9][0-9a-zA-Z.+-]*"' pyproject.toml | tr -d '"' | head -1)
          test -n "$MYPY"
          python -m pip install -e ".[test-ha]" "$MYPY"
      - name: Mypy (integration, strict)
        run: >-
          mypy --strict --python-version 3.13 --namespace-packages
          --explicit-package-bases custom_components/whiskerless
      - name: Pytest (integration)
        run: pytest tests/integration --cov --cov-report=term-missing --cov-fail-under=99
      - name: Coverage gate (config flow)
        run: coverage report --include='custom_components/whiskerless/config_flow.py' --fail-under=100

  integration-current-gate:
    name: Qualify the integration on the newest Home Assistant
    runs-on: ubuntu-latest
    steps:
      # Plain `mypy` and `pytest` cover the LIBRARY only — conftest auto-skips tests/integration
      # when Home Assistant is absent — so without this job an integration regression could reach
      # HACS with a green release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_2
        continue-on-error: true
        with:
          python-version: "3.15.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_2.outcome != 'success'
        with:
          python-version: "3.15.2"
      - name: Install
        # Home Assistant's own harness, pinned to one Core release so Renovate bumps it the day a
        # Core ships. That is the point of this leg: the 3.13 leg can only reach Core 2026.2.3,
        # so Core 2026.11 broke every config entry with CI green.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test-ha-current]"
      # No mypy here: Core 2026.11 types a config flow's schema as its own validator, which the
      # voluptuous schemas every integration still passes do not satisfy. The 3.13 leg type-checks.
      - name: Pytest (integration, newest Core)
        # `-p no:respx`: respx's plugin imports httpx before Home Assistant can alias it, and
        # plugin load order is arbitrary.
        run: >-
          pytest -p no:respx tests/integration
          --cov --cov-report=term-missing --cov-fail-under=99

  macos-gate:
    name: Qualify the macOS run on the source commit (no write credential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the macOS run to be green on the source commit
        # The release jobs never run the suite or the Homebrew formula on a Mac, and a formula
        # break that only a Mac sees once shipped in a whole release candidate. macos.yml runs both
        # on macOS 15 and the newest macOS for every pushed commit; this makes the release wait for
        # that verdict instead of assuming one. Required checks keep it off main's merges, but main
        # is reachable by anything that skipped a pull request, and cutting is when that matters.
        #
        # The SOURCE commit, not the tagged one: the tag job stamps version strings and commits, so
        # the tagged tree is a child of this SHA and no branch workflow ever evaluates it.
        #
        # check-forgejo-ci.sh passes only a run whose every job succeeded: a run whose macOS jobs
        # were scoped out (a Renovate branch) also concludes "success", and tested nothing.
        #
        # Unauthenticated: the project is public and Forgejo serves run status to anyone, so the
        # gate holds no credential at all.
        run: bash packaging/check-forgejo-ci.sh "${{ github.sha }}" macos.yml

  candidate-gate:
    name: Qualify the candidate this release promotes (no write credential)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # next-version.sh derives the version from the TAGS. A default shallow
          # checkout has none, so it would fall back to 0.0.0, ask about a version
          # that has no candidates, and report "nothing to check" — a gate that
          # passes hardest exactly when it is broken.
          fetch-depth: 0
          persist-credentials: false
      - name: Require the last rc's install matrix to be green
        # The install matrix installs PUBLISHED artifacts, so it can only ever run
        # after a release and can never gate the one it tests. This is where it
        # earns its keep: a candidate whose apt, dnf, Homebrew, .pkg, raw-binary or
        # PyPI install is broken must not become the stable, and noticing that
        # should not depend on somebody remembering to open the right tab.
        #
        # Reads only and holds no credential, like macos-gate beside it.
        run: |
          set -euo pipefail
          # Belt to fetch-depth's braces: if the tags did not arrive, every
          # version this could compute is fiction.
          git tag -l 'v*.*.*' | grep -q . || { echo "::error::no tags in this checkout"; exit 1; }
          version="$(bash packaging/next-version.sh "${{ inputs.bump }}" | sed -n 's/^version=//p')"
          [ -n "$version" ] || { echo "::error::could not compute the version being promoted"; exit 1; }
          bash packaging/check-rc-install-matrix.sh "$version"

  prepare:
    name: Open the qualified release PR
    if: github.ref == 'refs/heads/main'
    needs: [gate, integration-gate, integration-current-gate, macos-gate, candidate-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout with no persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce the qualified release intent
        env:
          BUMP: ${{ inputs.bump }}
          QUALIFIED_VERSION: ${{ needs.gate.outputs.version }}
          QUALIFIED_TAG: ${{ needs.gate.outputs.tag }}
          QUALIFIED_DATE: ${{ needs.gate.outputs.date }}
          QUALIFIED_INTENT_SHA256: ${{ needs.gate.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          # Same derivation as the gate, on a tree no gate step ever touched. Nothing here trusts
          # the gate beyond the version and the hash it has to match.
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP")
          [ "$version" = "$QUALIFIED_VERSION" ] && [ "$tag" = "$QUALIFIED_TAG" ] \
            || { echo "::error::qualified release intent changed between runners"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
            || { echo "::error::Tag $tag exists"; exit 1; }
          DEPS=$(bash packaging/dependency-bumps.sh "$previous")
          export DEPS
          bash packaging/promote-changelog.sh "$version" "$QUALIFIED_DATE"
          python3 packaging/stamp-version.py "$version"
          python3 packaging/stamp-version.py "$version" --check
          printf '%s\n' CHANGELOG.md README.md custom_components/whiskerless/manifest.json pyproject.toml \
            src/whiskerless/__init__.py | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          ACTUAL_INTENT_SHA256=$(git diff --binary | sha256sum | awk '{print $1}')
          [ "$ACTUAL_INTENT_SHA256" = "$QUALIFIED_INTENT_SHA256" ] \
            || { echo "::error::release bytes differ from the qualified intent"; exit 1; }

      - name: Commit the reproduced release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add -- CHANGELOG.md README.md pyproject.toml src/whiskerless/__init__.py \
            custom_components/whiskerless/manifest.json
          git commit -m "release: ${VERSION}"
          python3 packaging/stamp-version.py "$VERSION" --check

      - name: Open the release pull request
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          ISSUE: ${{ inputs.issue }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          : "${TOKEN:?missing repository write token}"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: token $TOKEN")
          issue_response=$(curl -fsS --max-time 30 -H "Authorization: token $ISSUE_TOKEN" "$api/issues/$ISSUE")
          jq -e '.state == "open" and .pull_request == null' <<< "$issue_response" >/dev/null \
            || { echo "::error::Select an open release issue"; exit 1; }

          branch="release/$TAG"
          remote_ref="refs/heads/$branch"
          git_auth="http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          base=$(git rev-parse HEAD^)
          remote_main=$(git -c "$git_auth" ls-remote --exit-code origin refs/heads/main | cut -f1)
          [ "$remote_main" = "$base" ] \
            || { echo "::error::main moved during qualification. Run Prepare Release again."; exit 1; }
          # A previous attempt may have pushed the same qualified tree before the PR request failed.
          # Compare the existing commit before reusing it. An unrelated branch never gets replaced.
          advertised=$(git -c "$git_auth" ls-remote origin "$remote_ref")
          if [ -n "$advertised" ]; then
            git -c "$git_auth" fetch --no-tags origin "$remote_ref"
            if [ "$(git rev-parse "FETCH_HEAD^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ] \
              || [ "$(git rev-parse "FETCH_HEAD^")" != "$base" ]; then
              echo "::error::Existing release branch differs. Check the open PR and retire the stale branch."
              exit 1
            fi
            candidate=$(git rev-parse FETCH_HEAD)
          else
            git -c "$git_auth" push origin "HEAD:$remote_ref"
            candidate=$(git rev-parse HEAD)
          fi

          # Updating or rebasing the PR changes its SHA and invalidates this qualification.
          qualification_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_NUMBER"
          status=$(jq -n --arg url "$qualification_url" \
            '{state:"success",context:"Release / Qualified candidate",target_url:$url,description:"Exact release tree qualified"}')
          curl -fsS --max-time 30 "${auth[@]}" -H 'Content-Type: application/json' \
            --data "$status" "$api/statuses/$candidate" >/dev/null

          echo "Qualified release commit: $candidate"

          pull_issues=$(curl -fsS --max-time 30 "${auth[@]}" --get \
            --data-urlencode 'state=open' --data-urlencode "head=$branch" \
            --data-urlencode 'page=1' --data-urlencode 'limit=50' "$api/pulls")
          existing=$(jq -c --arg branch "$branch" --arg repo "$GITHUB_REPOSITORY" \
            '.[] | select(.head.label == $branch and .head.repo.full_name == $repo and .base.ref == "main")' \
            <<< "$pull_issues")
          if [ -n "$existing" ]; then
            jq -e --arg prefix "Closes #$ISSUE." --arg branch "$branch" --arg sha "$candidate" \
              '.flow == 0 and .head.ref == $branch and .head.sha == $sha and (.body | startswith($prefix))' \
              <<< "$existing" >/dev/null \
              || { echo "::error::Existing release PR points to a different candidate or issue"; exit 1; }
            jq -er '.html_url' <<< "$existing"
            exit 0
          fi
          body=$(printf 'Closes #%s. The prepared release passed qualification.\n\nNo tests: %s\n' \
            "$ISSUE" 'The workflow replays the exact changelog and version stamps that passed qualification.')
          payload=$(jq -n --arg head "$branch" --arg title "Release $TAG" --arg body "$body" \
            '{head:$head,base:"main",title:$title,body:$body}')
          curl -fsS --max-time 30 "${auth[@]}" -H 'Content-Type: application/json' \
            --data "$payload" "$api/pulls" | jq -er '.html_url'
