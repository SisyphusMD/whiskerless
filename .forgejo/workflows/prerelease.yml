name: Prerelease

# On-demand release candidate, dispatched from any branch. Stamps an `-rc.N` version onto a TAG
# only — the branch and CHANGELOG are never touched — so main never carries an rc marker. The tag
# triggers publish.yml + release-macos.yml, which build the real wheel/.pkg/binary and publish them
# as a *prerelease*: never "latest", and only offered by HACS to users who opted into beta for this
# repository. Use it to put a build on real hardware before cutting the stable release.
#
# Split in two: `gate` decides what the rc IS and proves the tree is green while holding no
# credential; `tag` is the only job handed the write token, and it re-derives the same stamp from a
# fresh checkout and refuses to push unless the bytes hash to what the gate qualified.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version this rc is a candidate for"
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  # Stable and rc tag creation share one producer slot so they cannot interleave.
  group: release-cut
  cancel-in-progress: false

jobs:
  gate:
    name: Qualify prerelease intent (secret-free)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      intent_sha256: ${{ steps.intent.outputs.sha256 }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the next -rc version
        id: ver
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP" --rc)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Prerelease ${version} (candidate for ${version%-rc.*}, from ${GITHUB_REF_NAME})"

      - name: Refuse if the tag already exists
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || { echo "::error::Tag ${TAG} exists"; exit 1; }

      - name: Stamp the version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 packaging/stamp-version.py "$VERSION"
          python3 packaging/stamp-version.py "$VERSION" --check

      - name: Snapshot the exact intended prerelease diff
        id: intent
        run: |
          set -euo pipefail
          # The rc stamp is exactly these three files and nothing else. Hashing the patch here,
          # before any third-party tool is installed, is what the tag job reproduces byte-for-byte.
          printf '%s\n' custom_components/whiskerless/manifest.json pyproject.toml \
            src/whiskerless/__init__.py | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --binary > "$RUNNER_TEMP/intended-release.patch"
          sha256sum "$RUNNER_TEMP/intended-release.patch" \
            | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Test gate
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ble]"
          ruff check src custom_components tests packaging
          mypy
          # The same coverage floors ci.yml holds — without them a coverage
          # regression could pass the release gate and only go red after the tag.
          pytest -q --cov=whiskerless --cov-report=term-missing --cov-config=pyproject.toml --cov-fail-under=99
          coverage report --include='*/safety.py' --fail-under=100
          python -c "import whiskerless, sys; sys.exit(0 if whiskerless.__version__ == '${VERSION}' else 1)"

      - name: Prove the test toolchain changed no prerelease byte
        run: |
          set -euo pipefail
          git diff --binary | cmp - "$RUNNER_TEMP/intended-release.patch"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"

  floor-gate:
    name: Qualify the library floor (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      # ci.yml only runs on main pushes and pull requests, but a prerelease can
      # be dispatched from any branch — so this is the only thing standing
      # between a 3.12-only API on a feature branch and a PyPI upload.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.0"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ble]"
          ruff check src custom_components tests packaging
          mypy
          pytest -q --cov=whiskerless --cov-report=term-missing --cov-config=pyproject.toml --cov-fail-under=99
          coverage report --include='*/safety.py' --fail-under=100

  dependency-floor-gate:
    name: Qualify the declared dependency minimums
    runs-on: ubuntu-latest
    steps:
      # A separate job, not a second step in floor-gate: `uv pip install` leaves a
      # requirement the environment already satisfies alone, so running this after
      # a latest-deps install silently tests latest twice. A fresh runner is the
      # simplest way to guarantee the floors are what actually gets installed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.0"
      - name: Install at the declared minimums and test
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --resolution lowest-direct -e ".[dev,ble]"
          python -c "import aiomqtt, bleak; print('floors installed')"
          pytest -q

  integration-gate:
    name: Qualify the integration (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      # Plain `mypy` and `pytest` cover the LIBRARY only — conftest auto-skips
      # tests/integration when Home Assistant is absent — so without this an
      # integration regression could reach a HACS beta tester with a green rc.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test-ha]"
      - name: Mypy (integration, strict)
        run: >-
          mypy --strict --python-version 3.13 --namespace-packages
          --explicit-package-bases custom_components/whiskerless
      - name: Pytest (integration)
        run: pytest tests/integration --cov --cov-report=term-missing --cov-fail-under=99
      - name: Coverage gate (config flow)
        run: coverage report --include='custom_components/whiskerless/config_flow.py' --fail-under=100

  tag:
    name: Authorize and push prerelease tag
    needs: [gate, floor-gate, dependency-floor-gate, integration-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout with no persisted credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce the qualified prerelease intent
        env:
          BUMP: ${{ inputs.bump }}
          QUALIFIED_VERSION: ${{ needs.gate.outputs.version }}
          QUALIFIED_TAG: ${{ needs.gate.outputs.tag }}
          QUALIFIED_INTENT_SHA256: ${{ needs.gate.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          # Same derivation as the gate, on a tree no gate step ever touched. Nothing here trusts
          # the gate beyond the version and the hash it has to match.
          while IFS='=' read -r key value; do declare "$key=$value"; done \
            < <(bash packaging/next-version.sh "$BUMP" --rc)
          [ "$version" = "$QUALIFIED_VERSION" ] && [ "$tag" = "$QUALIFIED_TAG" ] \
            || { echo "::error::qualified prerelease intent changed between runners"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          python3 packaging/stamp-version.py "$version"
          python3 packaging/stamp-version.py "$version" --check
          printf '%s\n' custom_components/whiskerless/manifest.json pyproject.toml \
            src/whiskerless/__init__.py | sort > "$RUNNER_TEMP/expected-release-paths"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-release-paths"
          diff -u "$RUNNER_TEMP/expected-release-paths" "$RUNNER_TEMP/actual-release-paths"
          test -z "$(git diff --cached --name-only)"
          test -z "$(git ls-files --others --exclude-standard)"
          ACTUAL_INTENT_SHA256=$(git diff --binary | sha256sum | awk '{print $1}')
          [ "$ACTUAL_INTENT_SHA256" = "$QUALIFIED_INTENT_SHA256" ] \
            || { echo "::error::prerelease bytes differ from the qualified intent"; exit 1; }

      - name: Commit and tag the reproduced prerelease
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          # The version stamp rides on the TAGGED commit only; the branch is never pushed, so main
          # never carries an -rc marker. publish.yml and release-macos.yml check out the tag, so the
          # built artifacts still report the rc version.
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add pyproject.toml src/whiskerless/__init__.py \
            custom_components/whiskerless/manifest.json
          git commit -m "prerelease: ${VERSION}"
          python3 packaging/stamp-version.py "$VERSION" --check
          git tag -a -m "prerelease: ${VERSION}" "$TAG"

      - name: Push the prerelease tag
        env:
          TAG: ${{ needs.gate.outputs.tag }}
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          # Only the tag is pushed. The rc commit is reachable from it and from nothing else.
          git push "https://x-access-token:${TOKEN}@forgejo.bryantserver.com/SisyphusMD/whiskerless.git" \
            "refs/tags/${TAG}"
