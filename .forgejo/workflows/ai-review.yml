# CodeRabbit-style review on the house LLM; main's protection requires its `AI review` status.
# The job is SisyphusMD/project-rules main's review.yml, so no repo copies the job
# (SisyphusMD/project-rules#78), and
# pull_request_target and issue_comment both run this file from main, so a PR cannot change how
# it is reviewed. A reply on the PR re-runs the review, which can withdraw a finding.
# Only this caller is copied. Canonical copy: SisyphusMD/project-rules; repos get a copy.
name: AI review
on:
  pull_request_target:
    # edited: the description is reviewed too (a `No tests:` reason is the reviewer's call).
    types: [opened, edited, synchronize, reopened]
  issue_comment:
    types: [created]
concurrency:
  # One review per PR at a time, never cancelled: the reviewer's own comment also lands in this
  # group, and cancelling would stop a review between saving its findings and its status. It
  # lives here because Forgejo ignores concurrency in a called workflow.
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  shared-review:
    uses: SisyphusMD/project-rules/.forgejo/workflows/review.yml@main
    secrets:
      # read:issue only, for linked issues in other repos.
      ISSUE_READ_TOKEN: ${{ secrets.ISSUE_READ_TOKEN }}
      # Read-only on the owner's private .project-rules manifest, which the review reads.
      PROJECT_RULES_TOKEN: ${{ secrets.PROJECT_RULES_TOKEN }}
