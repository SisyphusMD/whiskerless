name: Prune superseded RCs (manual)

# The manual half of the sweep: publish.yml runs the same script automatically
# after every stable release, so the backlog normally clears itself. This is for
# previewing what a sweep would do (dry_run, the default), and for finishing one
# that a failed publish left half-done.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: report what would be pruned, delete nothing"
        type: boolean
        default: true

jobs:
  prune:
    name: Sweep every rc a published stable supersedes
    runs-on: ubuntu-latest
    steps:
      # A registry-wide destructive sweep must run the REVIEWED main-branch script, never a
      # dispatched branch's copy: the prune is global — branch content is irrelevant to what it
      # deletes — and the automatic path in publish.yml runs the main-derived script. Pinning to
      # main keeps the CURRENT deletion guards in force even when dispatched from a stale or
      # feature branch. The sibling project pins it for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Prune
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
          PACKAGE_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
        run: bash packaging/prune-rcs.sh
