name: Install matrix (Linux amd64)

# Installs every Linux channel we publish ON amd64, from the PUBLISHED artifacts,
# and then runs the tool. The arm64 and macOS halves are
# `.github/workflows/install-matrix.yml`, because architecture decides the forge
# here: this runner is amd64, GitHub has the native arm64 and macOS ones, and
# nothing is emulated anywhere. The rule and its reasoning are in
# docs/design/ci-split.md, and an invariant test enforces it.
#
# Every channel is a buildx target rather than a `docker run`, because the job
# itself runs in a container and a bind mount of the workspace is invisible to the
# daemon. BuildKit streams its context instead, so there is nothing to mount. What
# each channel does lives in packaging/install-smoke.Dockerfile.
#
# It runs AFTER a release by necessity, so it cannot gate the release it tests.
# What it gates is the next STABLE cut: release.yml's `candidate-gate` requires
# this AND the macOS matrix to be green before a candidate can be promoted.

# No `run-name:` here, deliberately: Forgejo ignores it — a dispatched run's title
# is just the workflow name, and a tag push's is the commit message, so neither
# records WHICH tag was tested. The tag goes in a JOB name instead, which Forgejo
# does evaluate, and that is what `check-rc-install-matrix.sh` reads to recognise
# a re-dispatch (dispatches run from main, so their ref says `main`).

on:
  push:
    tags: ["v*.*.*"]
  # Dispatchable with an explicit tag, the same shape as bottles.yml: when the
  # reason to re-run is a fix to these scripts, a dispatch at the tag would
  # faithfully re-run the old ones.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install and test, e.g. v0.2.0-rc.30"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FORGE: https://forgejo.bryantserver.com

jobs:
  # One poll for both legs. Each waiting separately would spend twice the API
  # budget to learn the same fact.
  wait:
    # The tag is in the name because this is the only place Forgejo keeps it.
    name: Wait for ${{ inputs.tag || github.ref_name }} to be installable
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          bash packaging/wait-for-release.sh "$TAG"

  linux:
    name: Linux installs (x86_64)
    needs: wait
    # NO QEMU setup, and no arm64 leg: this runner is amd64, the script refuses to
    # build for anything else, and the arm64 half runs natively on GitHub.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub-mirror.nas.bryantserver.com"]
      - name: Install every Linux channel and smoke each one
        env:
          VERSION: ${{ needs.wait.outputs.version }}
          # The self-hosted runner's dind volume; its own idle pruner keeps 25 GiB free, so a
          # third of the volume leaves room for the images the channels pull beside the cache.
          CACHE_CEILING_GB: "20"
        # The channel list lives in the script, not here, so the amd64 and arm64 halves of this
        # matrix cannot drift apart across two forges.
        run: bash packaging/install-matrix-arch.sh amd64

  summary:
    name: Every Linux amd64 channel installed and ran
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - run: echo "every Linux channel installed and ran on x86_64"
