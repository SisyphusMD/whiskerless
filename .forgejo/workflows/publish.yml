name: Publish

# Runs on the Forgejo source when a v* tag lands (from release.yml). It is the
# only place that can reach everything (Forgejo, the internal NAS, GitHub, PyPI),
# so it orchestrates the releases. The GitHub mirror's release-macos.yml appends
# the signed .pkg to the GitHub + public-Forgejo releases; the `nas-pkg` job here
# then bridges that .pkg over to the internal NAS (which GitHub can't reach).
on:
  push:
    tags: ["v*.*.*"]


jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build + upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # Idempotent: a partial upload must stay retryable, otherwise the
          # release gate below blocks forever on the already-published file.
          twine upload --skip-existing dist/*

  releases:
    name: Create releases + Linux binary (Forgejo, NAS, GitHub)
    runs-on: ubuntu-latest
    # The integration manifest pins whiskerless==<this version>, and HACS offers
    # the update as soon as the GitHub release exists. Publishing that before
    # PyPI has the version leaves the first updaters unable to set the
    # integration up at all.
    needs: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build Linux binary
        # Built inside manylinux_2_28, not on the runner: PyInstaller links the
        # frozen bundle against the build machine's glibc, and this runner's 2.39
        # would make the published binary refuse to start on Debian 12, RHEL 9 or
        # an older Pi OS — the machines most likely to be near a litter box.
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w quay.io/pypa/manylinux_2_28_x86_64 bash -euo pipefail -c '
            PY="$(ls -d /opt/python/cp3*-cp3* | grep -v "t$" | sort -V | tail -1)/bin/python"
            "$PY" -m pip install --upgrade pip pyinstaller
            "$PY" -m pip install ".[ble]"
            "$PY" -m PyInstaller --onefile --name whiskerless-linux-x86_64 \
              --collect-all bleak --collect-all aiomqtt packaging/launcher.py
            "$PY" packaging/check-glibc-floor.py "$(cat packaging/glibc-floor.txt)" \
              dist/whiskerless-linux-x86_64
          '
      - name: Smoke-test the binary
        # A frozen bundle that misses a hidden import fails at run time, not build
        # time, so a broken artifact would upload looking perfectly healthy.
        run: ./dist/whiskerless-linux-x86_64 --help > /dev/null
      - name: Release notes from CHANGELOG
        run: bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the three releases with the Linux binary
        run: |
          set -uo pipefail
          chmod +x packaging/forgejo-release.sh packaging/github-release.sh
          BIN=dist/whiskerless-linux-x86_64
          # Every target is attempted even when an earlier one fails. Run
          # fail-fast and sequentially, one unreachable host costs every target
          # after it its release, and the tag-wait poll in each helper means a
          # dead host burns ten minutes before the next one is even tried.
          # Failures are collected and re-raised at the end, so the job still
          # goes red.
          failed=""
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "$BIN" \
            || failed="$failed forgejo.bryantserver.com"
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "$BIN" \
            || failed="$failed forgejo.nas.bryantserver.com"
          packaging/github-release.sh \
            "${{ secrets.GH_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "$BIN" \
            || failed="$failed github.com"
          if [ -n "$failed" ]; then
            echo "::error::release publishing failed for:$failed"
            exit 1
          fi

  nas-pkg:
    name: Bridge the macOS .pkg → NAS
    needs: releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the .pkg on the public Forgejo release, then copy to NAS
        run: |
          set -euo pipefail
          API=https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/whiskerless
          # The .pkg is built + notarized on GitHub (slow), then appended to the
          # public Forgejo release. Wait for it (up to 30 min), then copy to NAS.
          urls=""
          for _ in $(seq 1 180); do
            urls=$(curl -sf "$API/releases/tags/$GITHUB_REF_NAME" \
              | jq -r '.assets[]? | select(.name | endswith(".pkg")) | .browser_download_url' || true)
            [ -n "$urls" ] && break
            sleep 10
          done
          if [ -z "$urls" ]; then
            echo "::warning::no .pkg on the Forgejo release after 30m; NAS release will lack it"
            exit 0
          fi
          echo "$urls" | while read -r u; do [ -n "$u" ] && curl -sSL -O "$u"; done
          bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          chmod +x packaging/forgejo-release.sh
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md *.pkg
