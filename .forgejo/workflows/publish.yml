name: Publish

# Runs on the Forgejo source when a v* tag lands (from release.yml). It is the
# only place that can reach everything (Forgejo, the internal NAS, GitHub, PyPI),
# so it orchestrates the releases. The GitHub mirror's release-macos.yml appends
# the signed .pkg to the GitHub + public-Forgejo releases; the `nas-pkg` job here
# then bridges that .pkg over to the internal NAS (which GitHub can't reach).
on:
  push:
    tags: ["v*.*.*"]


jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build + upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # Idempotent: a partial upload must stay retryable, otherwise the
          # release gate below blocks forever on the already-published file.
          twine upload --skip-existing dist/*

  releases:
    name: Create releases + Linux binary (Forgejo, NAS, GitHub)
    runs-on: ubuntu-latest
    # The integration manifest pins whiskerless==<this version>, and HACS offers
    # the update as soon as the GitHub release exists. Publishing that before
    # PyPI has the version leaves the first updaters unable to set the
    # integration up at all.
    needs: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Both architectures are built through buildx, the way the sister repos build theirs: the
      # docker-container BuildKit driver carries QEMU, so the arm64 leg emulates INSIDE the builder.
      # This runner is a Talos node with no usable host binfmt for a plain `docker run --platform
      # arm64` (that gets `exec format error`); buildx sidesteps it, and its context and output are
      # client-side streams, so it also dodges the workspace-visibility problem that a bind mount
      # hits when the job itself runs in a container.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          # The action's own default is tonistiigi/binfmt:latest — the one moving tag left in this
          # chain, so it is pinned here like every other image.
          # renovate: datasource=docker depName=tonistiigi/binfmt
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub-mirror.nas.bryantserver.com"]
      - name: Build the Linux binaries, .debs and .rpms (buildx, both arches)
        run: |
          set -euo pipefail
          export VERSION ARCH
          # deb and rpm both sort `~rc.1` BEFORE the final release; the tag's `-rc.1` is illegal in
          # a deb version and sorts AFTER 0.2.0 in rpm.
          raw="${GITHUB_REF_NAME#v}"
          VERSION="${raw/-rc./~rc.}"
          # renovate: datasource=pypi depName=pyinstaller
          # Held at 6.22.0 — see the clamp in .renovaterc.json, and run
          # packaging/check-pyinstaller-pin.sh to learn when it can be lifted.
          # 6.22.1's onefile bootloader refuses to start when its parent process
          # is a different executable, and under buildkit's emulator the parent
          # IS a different executable, so every arm64 self-test and package
          # smoke fails.
          PYINSTALLER="6.22.0"
          # Built from source with --enable-shared inside the manylinux image: manylinux's own
          # interpreters are static (Py_ENABLE_SHARED=0) and PyInstaller cannot freeze against them.
          # Kept on the same version the sister repos bundle. The sha256 is python.org's own for
          # this exact tarball and is checked before the build; bumping the version means bumping it.
          # renovate: datasource=python-version depName=python
          PYTHON_VERSION="3.14.7"
          PYTHON_SHA256="3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81"
          # renovate: datasource=docker depName=quay.io/pypa/manylinux_2_28_x86_64
          MANYLINUX_AMD64="quay.io/pypa/manylinux_2_28_x86_64:2026.08.15-1@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b"
          # renovate: datasource=docker depName=quay.io/pypa/manylinux_2_28_aarch64
          MANYLINUX_ARM64="quay.io/pypa/manylinux_2_28_aarch64:2026.08.15-1@sha256:561427136aabf3787bffb294b3515748241e0962d1527ae28bea1e076bfb9d99"
          # nfpm packages the binaries. Pinned image; its digest IS the integrity check.
          # renovate: datasource=docker depName=goreleaser/nfpm
          NFPM="goreleaser/nfpm:v2.47.0@sha256:a662cb167d7b6d3a83920c83d76b12d02b8ac5dd2c13e5c62c15270b23f6df0c"

          # ARCH is nfpm's internal arch (amd64/arm64) for BOTH formats — nfpm maps it to the .deb
          # arch and to the .rpm arch (x86_64/aarch64). nfpm is arch-independent, so it runs
          # natively here via docker create+cp rather than a bind mount.
          nfpm_pkg() { # nfpm_pkg <deb|rpm> <output-filename>
            local fmt="$1" name="$2" cid
            cid=$(docker create -e ARCH -e VERSION -w /w "$NFPM" \
              package -p "$fmt" -f packaging/nfpm.yaml -t "/w/$name")
            docker cp . "$cid":/w
            docker start -a "$cid"
            docker cp "$cid":"/w/$name" .
            docker rm "$cid" >/dev/null
          }
          build_arch() { # build_arch <docker-platform> <deb-arch> <rpm-arch> <binary-suffix> <builder-image>
            local plat="$1" rpmarch="$3" suffix="$4" builder="$5"
            ARCH="$2"
            rm -rf "out-$ARCH"
            docker buildx build --platform "$plat" \
              --build-arg PYTHON_BUILD_IMAGE="$builder" \
              --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
              --build-arg PYTHON_SHA256="$PYTHON_SHA256" \
              --build-arg PYINSTALLER="$PYINSTALLER" \
              -f packaging/linux.Dockerfile --target export --output "type=local,dest=out-$ARCH" .
            # nfpm.yaml reads ./dist/whiskerless; the raw release asset carries the
            # version and arch in its name (the naming scheme is documented in
            # packaging/README.md — x86_64/arm64, matching the macOS pair).
            rm -rf dist && mkdir dist
            cp "out-$ARCH/whiskerless" dist/whiskerless
            # The tag spelling (-rc.N), not $VERSION's ~rc.N: the tilde is a
            # deb/rpm ordering requirement, and GitHub rewrites it to a dot in
            # filenames — the raw binary must carry the same name on every forge.
            cp "out-$ARCH/whiskerless" "whiskerless-${raw}-linux-$suffix"
            nfpm_pkg deb "whiskerless_${VERSION}_${ARCH}.deb"
            nfpm_pkg rpm "whiskerless-${VERSION}.${rpmarch}.rpm"
          }
          build_arch linux/amd64 amd64 x86_64 x86_64 "$MANYLINUX_AMD64"
          build_arch linux/arm64 arm64 aarch64 arm64  "$MANYLINUX_ARM64"

          # Install and run the exact packages that are about to be published, on BOTH
          # architectures, before any asset leaves this job.
          smoke_pkg() { # smoke_pkg <docker-platform> <deb|rpm> <package>
            # Two statements: in one `local`, every argument expands before any assignment runs.
            local plat="$1" fmt="$2" package="$3"
            local result="package-smoke-$fmt-${plat##*/}"
            local dockerfile=packaging/package-smoke.Dockerfile
            if [ "$fmt" = rpm ]; then dockerfile=packaging/package-smoke-rpm.Dockerfile; fi
            cp "$package" "package-smoke.$fmt"
            rm -rf "$result"
            docker buildx build --platform "$plat" \
              -f "$dockerfile" --target result \
              --output "type=local,dest=$result" .
            test -f "$result/package-smoke-passed"
            # Not left lying around: the release step globs ./*.deb and ./*.rpm, and these
            # arch-neutral copies would ship as packages nobody can use.
            rm -f "package-smoke.$fmt"
          }
          smoke_pkg linux/amd64 deb "whiskerless_${VERSION}_amd64.deb"
          smoke_pkg linux/arm64 deb "whiskerless_${VERSION}_arm64.deb"
          smoke_pkg linux/amd64 rpm "whiskerless-${VERSION}.x86_64.rpm"
          smoke_pkg linux/arm64 rpm "whiskerless-${VERSION}.aarch64.rpm"
          ls -l ./*.deb ./*.rpm whiskerless-*-linux-*
      - name: Release notes from CHANGELOG
        run: bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the three releases with every Linux artifact
        run: |
          set -uo pipefail
          chmod +x packaging/forgejo-release.sh packaging/github-release.sh
          # Both raw binaries, both .debs and both .rpms. The helpers take [asset...].
          mapfile -t ASSETS < <(ls whiskerless-*-linux-x86_64 whiskerless-*-linux-arm64 ./*.deb ./*.rpm)
          # Every target is attempted even when an earlier one fails. Run
          # fail-fast and sequentially, one unreachable host costs every target
          # after it its release, and the tag-wait poll in each helper means a
          # dead host burns ten minutes before the next one is even tried.
          # Failures are collected and re-raised at the end, so the job still
          # goes red.
          failed=""
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || failed="$failed forgejo.bryantserver.com"
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || failed="$failed forgejo.nas.bryantserver.com"
          packaging/github-release.sh \
            "${{ secrets.GH_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || failed="$failed github.com"
          if [ -n "$failed" ]; then
            echo "::error::release publishing failed for:$failed"
            exit 1
          fi

  homebrew-tap:
    name: Update the Homebrew tap formula (stable or -rc per tag)
    # After pypi: update-tap.sh requires PyPI to already serve bytes identical to
    # the sdist it builds locally, which is the whole point of the check.
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Prove the formula installs before publishing it
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          # From a pristine export, like update-tap.sh: hatchling sweeps untracked
          # files beside the source into the sdist, which must not change what the
          # smoke installs.
          work="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$work"
          python -m build --sdist --outdir "$work/dist" "$work" >/dev/null
          # The sdist keeps its versioned filename: Homebrew derives the formula
          # version from the URL, and a versionless file:// url is a formula
          # Homebrew refuses before install.
          mkdir -p formula-smoke-dist
          cp "$work"/dist/whiskerless-*.tar.gz formula-smoke-dist/
          docker buildx build --build-arg TEST_TAG="$GITHUB_REF_NAME" \
            -f packaging/homebrew-smoke.Dockerfile --target result \
            --output "type=local,dest=homebrew-smoke-result" .
          test -f homebrew-smoke-result/homebrew-smoke-passed
      - name: Fill the formula + push to the tap
        env:
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_TAP_WRITE_PAT }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          AUTH="http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          # Cloned OUTSIDE the checkout. update-tap.sh builds an sdist to compare against PyPI, and
          # anything left beside the source is swept into it — a tap clone here made the comparison
          # fail against a hash that was never wrong.
          tap="$(mktemp -d)/tap"
          git -c "$AUTH" clone "${GITHUB_SERVER_URL}/SisyphusMD/homebrew-tap.git" "$tap"
          chmod +x packaging/update-tap.sh
          bash packaging/update-tap.sh "$GITHUB_REF_NAME" "$tap"
          cd "$tap"
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add Formula/
          git commit -m "whiskerless ${GITHUB_REF_NAME#v}" || { echo "no change to publish"; exit 0; }
          git -c "$AUTH" push

  nas-pkg:
    name: Bridge the macOS .pkg → NAS
    needs: releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the .pkg on the public Forgejo release, then copy to NAS
        run: |
          set -euo pipefail
          API=https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/whiskerless
          # The .pkg is built + notarized on GitHub (slow), then appended to the
          # public Forgejo release. Wait for it (up to 30 min), then copy to NAS.
          urls=""
          for _ in $(seq 1 180); do
            urls=$(curl -sf "$API/releases/tags/$GITHUB_REF_NAME" \
              | jq -r '.assets[]? | select(.name | endswith(".pkg")) | .browser_download_url' || true)
            [ -n "$urls" ] && break
            sleep 10
          done
          if [ -z "$urls" ]; then
            echo "::warning::no .pkg on the Forgejo release after 30m; NAS release will lack it"
            exit 0
          fi
          echo "$urls" | while read -r u; do [ -n "$u" ] && curl -sSL -O "$u"; done
          bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          chmod +x packaging/forgejo-release.sh
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md *.pkg

  prune-rcs:
    name: Prune the candidates this release supersedes
    # Last, not after `releases`: the sweep deletes a candidate only once its
    # stable exists on all three hosts, and nas-pkg is what finishes the set.
    # Run any earlier and this release would find its own stable half-published
    # and keep every rc, turning the automatic pass into a silent no-op.
    needs: nas-pkg
    # An rc publishes through this same workflow, and its own stable does not
    # exist yet, so the sweep would enumerate every host to print zero. Skip it
    # rather than pay for the round trip.
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prune
        env:
          DRY_RUN: "false"
          FORGEJO_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
        run: bash packaging/prune-rcs.sh
