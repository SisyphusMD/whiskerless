name: Publish

# Runs on the Forgejo source when a v* tag lands (from release.yml): publishes to PyPI,
# builds the amd64 binary, .deb and .rpm, and creates the release on all three registries
# (Forgejo, the internal NAS, GitHub). The same tag starts release-arm64.yml (the arm64 set),
# release-macos.yml (the signed .pkg) and bottles.yml, each appending to all three registries;
# the reconcile job here heals any registry a copy failed to reach.
on:
  # Dispatchable so a partly-failed publish can be finished without cutting a new
  # release. rc.27 lost its GitHub assets to a mirror-timing failure and there was
  # no way to retry the job — the only recovery was another rc. Dispatch with the
  # tag as the ref; every helper here is idempotent (create-or-reuse, replace
  # assets), so re-running a partial publish completes it rather than duplicating.
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]


concurrency:
  # Deduplicate only the same tag, and never cancel. A single global group keeps just one pending
  # run, so a later tag can displace an earlier tag's still-pending publication and leave it
  # assetless. The FULL ref, because `ref_name` drops refs/heads and refs/tags alike: a branch
  # sharing a tag's name would land in the same group, and publish.yml is dispatchable.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Dispatching from `main` would treat "main" as the version: packages named for
  # it, a wait for a tag that does not exist, and releases called `main` created
  # on all three hosts. The trigger exists for re-driving a TAG.
  guard:
    name: Refuse anything that is not a release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the ref
        run: |
          set -euo pipefail
          # The SAME grammar every other release step enforces, not a glob. `v0.3.0.dev1`
          # matches `v*.*.*` and is rejected by rel_validate_tag — and by every helper
          # downstream — so a glob here lets a dispatch start the PyPI upload and the builds
          # before anything refuses it.
          case "${GITHUB_REF}" in
            refs/tags/*) : ;;
            *) echo "::error::${GITHUB_REF} is not a tag — dispatch this with a release tag as the ref" >&2; exit 1 ;;
          esac
          # shellcheck source=/dev/null
          . packaging/release-common.sh
          rel_validate_tag "${GITHUB_REF_NAME}"
          echo "publishing ${GITHUB_REF_NAME}"

      - name: Refuse a tag that has already published
        # Scoped to `push`: a dispatch is the documented way to FINISH a partial publish, and every
        # helper it runs is idempotent, so a dispatch must never be refused for this reason.
        if: ${{ github.event_name == 'push' }}
        env:
          GH_READ: ${{ secrets.GH_REPO_READ_PAT }}
        run: |
          set -euo pipefail
          # A tag push for a tag that already has a release is a RE-pushed tag. Rewriting history
          # moves every tag at once and each move re-enters this workflow, so one rewrite queues one
          # of these runs per tag. Republishing cannot succeed - release assets are immutable - and
          # without this the run spends twenty minutes building to reach a refusal knowable in
          # seconds.
          #
          # BOTH publication targets, because a publish that died between them leaves the tag released
          # on one and not the other. Asking only the source of truth would answer 404 for exactly that
          # case and let a rewritten tag through, which then writes new bytes to Forgejo and the NAS
          # before GitHub refuses its immutable assets — the inconsistency this guard exists to prevent.
          # Asserted before the loop, not per-target: the mirror probe must never go out bare, and
          # a 403 from an exhausted public quota reads as "unknown" here, which would let a tag whose
          # partial release exists only on GitHub straight through. The per-target conditional below
          # stays because ONE target is this forge, which needs no token at all.
          : "${GH_READ:?a read-only GitHub token is required to check the mirror}"
          published_on=""
          for target in \
            "the source of truth|${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}|" \
            "the mirror|https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}|${GH_READ}"
          do
            where=${target%%|*}; rest=${target#*|}; url=${rest%%|*}; tok=${rest#*|}
            auth=()
            [ -n "$tok" ] && auth=(-H "Authorization: Bearer $tok")
            code=000
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${auth[@]}" "$url" 2>/dev/null) || code=000
              case "$code" in 200|404) break ;; esac
              echo "::warning::$where answered ${code} for ${GITHUB_REF_NAME} (attempt ${attempt}/3)"
              sleep $(( attempt * 10 ))
            done
            case "$code" in
              404) ;;
              200) published_on="$where"; break ;;
              # Fail CLOSED. This guard exists to stop a re-pushed tag writing new bytes to the hosts
              # that lack its release while the one that has it refuses them, and a probe that cannot
              # answer is exactly when that happens. With a mandatory token the budget is 5,000/hour,
              # so an unanswerable probe is an anomaly rather than routine — and the escape is already
              # here: this step only runs on `push`, so a dispatch with the tag as the ref bypasses it.
              *)
                echo "::error::could not determine whether ${GITHUB_REF_NAME} is already published on ${where} (HTTP ${code}). Refusing rather than risk publishing over a partial release. If this tag is genuinely new, dispatch this workflow with the tag as the ref." >&2
                exit 1
                ;;
            esac
          done
          if [ -n "$published_on" ]; then
            echo "::error::${GITHUB_REF_NAME} already has a published release on ${published_on}, so this push is a re-pushed tag rather than a new release, and its assets are immutable. To finish or repair a partial publish, dispatch this workflow with the tag as the ref." >&2
            exit 1
          fi
          echo "no release for ${GITHUB_REF_NAME} on either target"

  pypi:
    name: Publish to PyPI
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.15.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.15.2"
      - name: Build + upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # Idempotent: a partial upload must stay retryable, otherwise the
          # release gate below blocks forever on the already-published file.
          twine upload --skip-existing dist/*

  releases:
    name: Create releases + Linux binary (Forgejo, NAS, GitHub)
    runs-on: ubuntu-latest
    # The integration manifest pins whiskerless==<this version>, and HACS offers
    # the update as soon as the GitHub release exists. Publishing that before
    # PyPI has the version leaves the first updaters unable to set the
    # integration up at all.
    needs: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_2
        continue-on-error: true
        with:
          python-version: "3.15.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_2.outcome != 'success'
        with:
          python-version: "3.15.2"
      # NO QEMU. This runner is amd64 and builds only amd64; arm64 is built on a native arm64
      # runner (release-arm64.yml). buildx is still used because its
      # context and output are client-side streams, which dodges the workspace-visibility problem
      # a bind mount hits when the job itself runs in a container — not because anything emulates.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/docker.io"]
            [registry."ghcr.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/ghcr.io"]
            [registry."quay.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/quay.io"]
            [registry."registry.k8s.io"]
              mirrors = ["image-mirror.lan.bryantserver.com/registry.k8s.io"]
            [registry."public.ecr.aws"]
              mirrors = ["image-mirror.lan.bryantserver.com/public.ecr.aws"]
      - name: Build the amd64 binary, .deb and .rpm (native — nothing is emulated here)
        id: build
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          # The manylinux builder's dnf installs, through the NAS artifact cache.
          DNF_MIRROR: https://artifacts.lan.bryantserver.com
        run: |
          set -euo pipefail
          # The build-time pins live in packaging/release-pins.env and the script sources them
          # itself — one file, because the arm64 half of this release is built by another workflow
          # and two inline copies would drift the first time one was bumped.
          #
          # amd64 ONLY. arm64 is built natively by release-arm64.yml and
          # appended to this release afterwards — this runner is amd64, and emulating arm64 here
          # is what broke rc.18's Linux assets. build-linux-arch.sh refuses a host/target mismatch
          # rather than silently emulating, so that cannot come back by accident.
          bash packaging/build-linux-arch.sh amd64 "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG
        run: bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the three releases with the amd64 Linux artifacts
        run: |
          set -uo pipefail
          chmod +x packaging/forgejo-release.sh packaging/github-release.sh
          # The amd64 artifacts this runner built. The arm64 ones are appended to this same
          # release by release-arm64.yml, the way the macOS .pkg is — so a glob for them here
          # would either match nothing or race that job.
          mapfile -t ASSETS < <(ls whiskerless-*-linux-x86_64 ./*_amd64.deb ./*.x86_64.rpm)
          # `ls` failing inside a process substitution cannot fail the step, so a missing artifact
          # would publish a short asset list and a checksum file to match — a release that looks
          # healthy and is not. Three is the whole per-arch set: binary, .deb, .rpm.
          [ "${#ASSETS[@]}" -eq 3 ] || {
            echo "::error::expected 3 amd64 artifacts, found ${#ASSETS[@]}: ${ASSETS[*]-}" >&2
            exit 1
          }
          # A checksum file so a download can be verified at all. The macOS .pkg
          # is signed and notarized because Gatekeeper refuses to run it
          # otherwise; nothing compels the Linux packages, and `dpkg -i` does not
          # check signatures even when they exist — so the practical gap is
          # "did this arrive intact", which a checksum closes without a signing
          # key to hold, rotate and revoke. It proves integrity, not authenticity:
          # it is served from the same host as the artifacts. Authenticity would
          # mean signing THIS file with a key published elsewhere, which is worth
          # doing only alongside an apt/dnf repository (backlog #75).
          #
          # The .pkg is absent here on purpose — it does not exist yet at this
          # point in the pipeline, being built later by release-macos.yml.
          # Both spellings, because GitHub's asset API rewrites `~` to `.` in the
          # uploaded FILENAME (documented in packaging/README.md) while Forgejo
          # serves the canonical name. One manifest has to verify against either,
          # so an artifact whose name contains `~` is listed twice with the same
          # hash. Verify with `sha256sum -c --ignore-missing SHA256SUMS-$(uname -m)`;
          # the spelling you did not download is the one reported missing.
          #
          # One file PER ARCHITECTURE, named for `uname -m` so that command needs no
          # editing anywhere. Each is written by the machine that BUILT those bytes,
          # arm64 included — a checksum written by a host that did not build the
          # artifact is worth less. Published assets are immutable (reconcile and
          # prune-rcs both depend on that), so a single combined file could not be
          # appended to when the arm64 job lands later.
          sums="SHA256SUMS-x86_64"
          sha256sum "${ASSETS[@]}" | sed 's| \./| |' > "$sums"
          awk '$2 ~ /~/ { name = $2; gsub(/~/, ".", name); print $1 "  " name }' "$sums" >> "$sums.alt"
          [ -s "$sums.alt" ] && cat "$sums.alt" >> "$sums"
          rm -f "$sums.alt"
          ASSETS+=("$sums")
          echo "checksums:"; cat "$sums"
          # Every target is attempted even when an earlier one fails. Run
          # fail-fast and sequentially, one unreachable host costs every target
          # after it its release, and the tag-wait poll in each helper means a
          # dead host burns ten minutes before the next one is even tried.
          # Failures are collected and re-raised at the end, so the job still
          # goes red; the helpers name the host in their own errors.
          #
          # Cluster, then GitHub, then the NAS, in the sibling's order and failure spelling, so the
          # one publish step reads the same in both repositories.
          fail=0
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          packaging/github-release.sh \
            "${{ secrets.GH_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          packaging/forgejo-release.sh forgejo.lan.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || fail=1
          exit "$fail"
  registry:
    name: Publish .deb/.rpm into the apt/dnf repositories
    needs: [guard, releases]
    # Runs even when a release UPLOAD failed — the repository is a fourth destination
    # with its own failure modes, and #76's lesson was that a job publishing to
    # independent places must not let the first failure skip the rest.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect BOTH architectures, then publish
        # A repository is not a release page: whatever lands there is what `apt install`
        # hands people immediately, with no way to tell the set is short. publish-registry.sh
        # refuses a partial set for that reason, and since arm64 is built by its own
        # workflow this job's own workspace holds only half of it — so it reads the full set
        # off the release, and fails rather than publishing half.
        run: |
          set -euo pipefail
          chmod +x packaging/publish-registry.sh packaging/fetch-release-assets.sh
          select='.assets[]? | select(
                    (.name | endswith("_amd64.deb"))
                    or (.name | endswith("_arm64.deb"))
                    or (.name | endswith(".x86_64.rpm"))
                    or (.name | endswith(".aarch64.rpm"))
                  ) | .browser_download_url'
          # No `|| true`: an incomplete set must stop this job, not be published.
          packaging/fetch-release-assets.sh "$GITHUB_REF_NAME" 4 "$select"
          # A SEPARATE token from the release PAT: Forgejo scopes the package registry on its
          # own, and `write:repository` — everything the release helpers need — cannot upload a
          # package. Checked before writing this: the release token carries only
          # `write:repository`, so it would have 403d here.
          packaging/publish-registry.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}" "$GITHUB_REF_NAME" ./*.deb ./*.rpm

  render-homebrew-tap:
    name: Update the Homebrew tap formula (stable or -rc per tag)
    # After pypi: update-tap.sh requires PyPI to already serve bytes identical to
    # the sdist it builds locally, which is the whole point of the check.
    # `always()` rather than the default needs-condition, matching every other downstream job
    # here: `twine upload --skip-existing` can report failure after the sdist actually landed,
    # and a skipped tap would leave the formula on the previous version with nothing to heal it.
    # The render fails on its own terms if the sdist really is absent. NOT `always()`: this job
    # pushes to the tap, and a cancelled release must not keep making externally visible writes.
    needs: [guard, pypi]
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_3
        continue-on-error: true
        with:
          python-version: "3.15.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_3.outcome != 'success'
        with:
          python-version: "3.15.2"
      - name: Prove the formula installs before publishing it
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          # From a pristine export, like update-tap.sh: hatchling sweeps untracked
          # files beside the source into the sdist, which must not change what the
          # smoke installs.
          work="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$work"
          python -m build --sdist --outdir "$work/dist" "$work" >/dev/null
          # The sdist keeps its versioned filename: Homebrew derives the formula
          # version from the URL, and a versionless file:// url is a formula
          # Homebrew refuses before install.
          mkdir -p formula-smoke-dist
          cp "$work"/dist/whiskerless-*.tar.gz formula-smoke-dist/
          docker buildx build --build-arg TEST_TAG="$GITHUB_REF_NAME" \
            --build-arg BREW_MIRROR="https://image-mirror.lan.bryantserver.com" \
            -f packaging/homebrew-smoke.Dockerfile --target result \
            --output "type=local,dest=homebrew-smoke-result" .
          test -f homebrew-smoke-result/homebrew-smoke-passed
      - name: Render the formula update without a write credential
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tap="$RUNNER_TEMP/tap-source"
          artifact="$GITHUB_WORKSPACE/tap-artifact/Formula"
          git clone --branch main "https://forgejo.bryantserver.com/SisyphusMD/homebrew-tap.git" "$tap"
          python -m pip install --upgrade pip build
          bash packaging/update-tap.sh "$TAG" "$tap"
          mkdir -p "$artifact"
          cp -- "$tap/Formula/whiskerless-rc.rb" "$artifact/"
          if [[ "$TAG" != *-rc.* ]]; then
            cp -- "$tap/Formula/whiskerless.rb" "$artifact/"
          fi

      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: tap-formula
          path: tap-artifact/Formula
          if-no-files-found: error
          overwrite: true

  homebrew-tap:
    needs: [guard, render-homebrew-tap]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.render-homebrew-tap.result == 'success' }}
    uses: ./.forgejo/workflows/submit-tap-formula.yml
    with:
      tag: ${{ github.ref_name }}
      phase: formula
      artifact: tap-formula
    secrets:
      tap-token: ${{ secrets.CLUSTER_FORGEJO_TAP_WRITE_PAT }}

  render-homebrew-bottles:
    name: Add the bottle block to the tap (second pass)
    # The tap must already hold this version (the bottles were built by
    # installing it) and the release must exist (the bottles are its assets).
    needs: [guard, homebrew-tap, releases]
    # `releases` going red does not mean the bottles are missing — they are
    # appended by bottles.yml, to a release that may well have been
    # created successfully before some later host failed. #76 again.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python_4
        continue-on-error: true
        with:
          python-version: "3.15.2"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.setup_python_4.outcome != 'success'
        with:
          python-version: "3.15.2"
      - name: Wait for every bottle manifest on the Forgejo release
        run: |
          set -euo pipefail
          API=https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/whiskerless
          # Three platforms. A stable tag bottles BOTH formulae — the stable one
          # and the rc one it re-points at itself — because a bottle's filename
          # embeds the formula name and its keg is rooted at
          # `<formula>/<version>/`, so one cannot be renamed into the other.
          # Without the second set, `brew install whiskerless-rc` after a stable
          # release silently goes back to compiling.
          case "$GITHUB_REF_NAME" in
            *-rc.*) expected=3 ;;
            *)      expected=6 ;;
          esac
          echo "waiting for $expected bottle manifest(s) and the archives they name"
          # The readiness condition is NOT "the manifests arrived". They are
          # uploaded in the same pass as the archives and their double-dash names
          # sort first, so the manifests are normally there while tarballs are
          # still in flight — a one-shot check would fail on a perfectly healthy
          # release. And names alone are not enough either: a re-run replaces an
          # archive in place, so a same-named file from the previous attempt can
          # be sitting there while the manifest already describes the new one.
          #
          # So the loop waits until every manifest is present AND every archive it
          # names hashes to the sha256 recorded for it. That is exactly the claim
          # the published formula makes, checked before making it — a formula
          # whose sha256 does not match the served file fails every install, and
          # unlike a missing block it does not fall back to building from source.
          #
          # Up to 60 minutes: the macOS legs build cryptography from source, twice
          # on a stable tag, on the slowest runners in the fleet.
          ready=""
          for _ in $(seq 1 180); do
            assets=$(curl -sf "$API/releases/tags/$GITHUB_REF_NAME" \
              | jq -r '.assets[]? | "\(.name)\t\(.browser_download_url)"' || true)
            urls=$(printf '%s\n' "$assets" | awk -F'\t' '$1 ~ /\.bottle\.json$/ {print $2}')
            if [ "$(printf '%s\n' "$urls" | grep -c . || true)" -lt "$expected" ]; then
              sleep 20; continue
            fi
            rm -rf manifests && mkdir -p manifests
            printf '%s\n' "$urls" | while read -r u; do
              [ -n "$u" ] && curl -sSL -o "manifests/$(basename "$u")" "$u"
            done
            ok=true
            while read -r name want; do
              [ -n "$name" ] || continue
              url=$(printf '%s\n' "$assets" | awk -F'\t' -v n="$name" '$1 == n {print $2}')
              if [ -z "$url" ]; then ok=false; break; fi
              if ! got=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1); then
              ok=false
              break
            fi
              if [ "$got" != "$want" ]; then ok=false; break; fi
            done < <(jq -r '.[].bottle.tags[] | "\(.filename)\t\(.sha256)"' manifests/*.json)
            if [ "$ok" = true ]; then ready=1; break; fi
            sleep 20
          done
          if [ -z "$ready" ]; then
            echo "::error::the bottles never arrived intact after 60m — the tap keeps its unbottled formula"
            exit 1
          fi
          ls -l manifests/
          echo "every bottle the manifests name is present and matches its sha256"
      - name: Render the bottles update without a write credential
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tap="$RUNNER_TEMP/tap-source"
          artifact="$GITHUB_WORKSPACE/tap-artifact/Formula"
          git clone --branch main "https://forgejo.bryantserver.com/SisyphusMD/homebrew-tap.git" "$tap"
          python -m pip install --upgrade pip build
          bash packaging/update-tap.sh "$TAG" "$tap" "$PWD/manifests"
          mkdir -p "$artifact"
          cp -- "$tap/Formula/whiskerless-rc.rb" "$artifact/"
          if [[ "$TAG" != *-rc.* ]]; then
            cp -- "$tap/Formula/whiskerless.rb" "$artifact/"
          fi

      - uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: tap-bottles
          path: tap-artifact/Formula
          if-no-files-found: error
          overwrite: true

  homebrew-bottles:
    needs: [guard, render-homebrew-bottles]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.render-homebrew-bottles.result == 'success' }}
    concurrency:
      group: tap-bottle-refresh-${{ github.ref_name }}
      cancel-in-progress: false
    uses: ./.forgejo/workflows/submit-tap-formula.yml
    with:
      tag: ${{ github.ref_name }}
      phase: bottles
      artifact: tap-bottles
    secrets:
      tap-token: ${{ secrets.CLUSTER_FORGEJO_TAP_WRITE_PAT }}

  reconcile:
    name: Reconcile releases across registries (heal history)
    # `always()`: this exists precisely for the case where publishing to one of the three
    # registries failed, so gating it on those jobs SUCCEEDING would disable it in the only
    # situation it is for. A conflict the script cannot decide is reported for a human rather than
    # overwritten, and the next release retries every tag. That heal is warn-only by design
    # (reconcile-releases.sh exits 0), so one unhealable historical tag cannot block every future
    # prune. What turns the job red is this tag's .pkg or arm64 set never arriving, and prune-rcs,
    # which needs this job, then keeps the candidates rather than sweeping against a short release.
    #
    # It WAITS for those first, which is not the same as being gated on them. Reconcile heals a
    # registry from a two-registry content quorum, and the .pkg and the arm64 set come from their
    # own workflows (release-macos.yml, release-arm64.yml), so sweeping before they land would find
    # nothing to heal: an arm64 set that reached one registry and failed the others would stay
    # missing, and prune-rcs would then delete the candidates that still had it.
    needs: [guard, releases]
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all tags needed for the reconcile loop
          persist-credentials: false
      - name: Require the current release's .pkg and arm64 set, then reconcile every tag
        # A remote filename or byte count is not evidence that an artifact is intact. This downloads
        # each recognised asset, accepts bytes only when at least two registries agree on the
        # SHA-256, and fills that content into any registry MISSING it. A registry already serving
        # DIFFERENT bytes is reported for a human, never overwritten: replacing means deleting
        # first, and a delete plus a failed re-upload destroys the only good copy.
        #
        # Homebrew bottles are deliberately outside this — see packaging/asset-roles.sh for why a
        # content quorum is the wrong model for an artifact that is not reproducible.
        env:
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
        run: |
          set -uo pipefail
          API=https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/whiskerless
          # release-macos.yml installs and exercises the signed Apple Silicon package before
          # publishing it here, so its presence is the qualification gate, not merely an
          # asset-availability convenience; the arm64 set is waited for so the quorum includes it.
          fail=0
          qualified=false
          # A wall clock, and every request bounded: an API that accepts and then stalls would
          # otherwise hold this runner far past the 60 minutes the error below promises. Sixty,
          # because the .pkg and the macOS bottle share one macOS 15 VM and queue behind each other.
          deadline=$(( $(date +%s) + 3600 ))
          # Both internal registries, not just the public one. Each producer uploads to the public
          # Forgejo first, then GitHub, then the NAS, and reconcile snapshots every registry once and
          # heals only from two matching copies. Starting at the first upload would leave a stalled
          # GitHub copy with nothing to heal from; waiting for the NAS guarantees two.
          NAS_API=https://forgejo.lan.bryantserver.com/api/v1/repos/SisyphusMD/whiskerless
          has_set() {
            curl -sf --connect-timeout 10 --max-time 30 -H "Authorization: token $2" "$1/releases/tags/$GITHUB_REF_NAME" | jq -r '
              [.assets[]?.name] as $names |
              # By SUFFIX, not exact name: filenames carry the version, and this gate must not
              # have to know how the version is spelled to recognise the arch it qualifies.
              ($names | any(endswith("-macos-arm64.pkg")))
              and ($names | any(endswith("_arm64.deb")))
              and ($names | any(endswith(".aarch64.rpm")))
              and ($names | any(endswith("-linux-arm64")))
              and ($names | any(. == "SHA256SUMS-aarch64"))
            ' 2>/dev/null || echo false
          }
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ "$(has_set "$API" "$CLUSTER_TOKEN")" = true ] && [ "$(has_set "$NAS_API" "$NAS_TOKEN")" = true ]; then
              qualified=true
              break
            fi
            sleep 10
          done
          [ "$qualified" = true ] || {
            echo "::error::current tag's .pkg and arm64 set were not all published to the public Forgejo and the NAS within 60m"
            fail=1
          }
          chmod +x packaging/reconcile-releases.sh packaging/forgejo-release.sh packaging/github-release.sh
          # Exits 0 on a conflict it reports; this catches only the script itself breaking.
          bash packaging/reconcile-releases.sh || fail=1
          exit "$fail"

  install-matrix:
    name: Hand the finished release to the install matrix
    # Everything the matrix installs FROM has to exist first: the release assets, both package
    # registries, the NAS copy, and a tap carrying this version's bottle block. Waiting for that
    # from a job started by the tag push cost more than it looks — the waiter and the publisher
    # competed for the same handful of runner slots, so the wait made the publish slower, which
    # made the wait longer.
    # Deliberately NOT waiting on `reconcile`. It sweeps every historical tag across all three
    # registries and takes ~13 minutes, and the matrix does not need it: wait-for-release.sh polls
    # until the release is actually installable, so a copy reconcile heals while the matrix is
    # waiting is still picked up. Blocking on it put those 13 minutes on the critical path of every
    # release to buy nothing.
    # The arm64 set and the .pkg come from their own workflows, which no `needs` can name;
    # wait-for-release.sh holds the matrix until they are on the release.
    needs: [guard, releases, registry, homebrew-tap, homebrew-bottles]
    # Runs even when a producer reported failure, which is not laxness but the point: a destination
    # can fail its upload and `reconcile` can then heal the release across registries, leaving a
    # COMPLETE release whose handoff had already been skipped — a release with no install matrix at
    # all, which is the exact state this job exists to prevent. Whether the release is genuinely
    # installable is not decided here; wait-for-release.sh is the authority on that, and it names
    # what is missing when it is not.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the matrix at this tag
        env:
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
        run: |
          set -euo pipefail
          # From `main`, not from the tag: a dispatch at the tag would run the matrix scripts frozen
          # there, and the tag input is what tells it which release to install.
          curl -fsS --max-time 60 --retry 3 --retry-connrefused --retry-max-time 180 \
            -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"ref\":\"main\",\"inputs\":{\"tag\":\"$GITHUB_REF_NAME\"}}" \
            "https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/whiskerless/actions/workflows/install-matrix.yml/dispatches"
          echo "dispatched the install matrix for $GITHUB_REF_NAME"

  prune-rcs:
    name: Prune the candidates this release supersedes
    # Last, not after `releases`: the sweep deletes a candidate only once its
    # stable exists on all three hosts, and reconcile (below) is what confirms the
    # set. Run any earlier and this release would find its own stable half-published
    # and keep every rc, turning the automatic pass into a silent no-op.
    #
    # homebrew-bottles too, since #15: the sweep now deletes registry packages as
    # well as releases, and it must not start while this release is still
    # assembling the artifacts that replace them.
    #
    # And reconcile: the sweep's own precondition is that the stable is present and identical on
    # all three hosts, which is exactly what reconcile repairs. Pruning first would read a gap that
    # was about to be healed as a reason to keep every candidate — or, worse, delete the rc that
    # still held the only copy of content one host was missing.
    # `registry` too: prune's package check asks whether the stable REPLACES the candidate in the
    # repositories, so running while that upload is still in flight reads a not-yet-published
    # stable as a reason to keep every candidate — and then exits 0. Nothing re-runs the sweep,
    # so the leftovers would sit there until some later stable happened to win the race.
    needs: [releases, registry, homebrew-tap, homebrew-bottles, reconcile]
    # An rc publishes through this same workflow, and its own stable does not
    # exist yet, so the sweep would enumerate every host to print zero. Skip it
    # rather than pay for the round trip.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prune
        env:
          DRY_RUN: "false"
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
          PACKAGE_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
        run: |
          # Warn-only. The stable is already published by this point, so a prune problem must never
          # redden the release or make a valid stable look failed.
          bash packaging/prune-rcs.sh \
            || echo "::warning::prune-rcs exited nonzero; the stable release is unaffected"
