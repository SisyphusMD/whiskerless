name: Publish

# Runs on the Forgejo source when a v* tag lands (from release.yml). It is the
# only place that can reach everything (Forgejo, the internal NAS, GitHub, PyPI),
# so it orchestrates the releases. The GitHub mirror's release-macos.yml appends
# the signed .pkg to the GitHub + public-Forgejo releases; the `nas-bridge` job here
# then bridges that .pkg over to the internal NAS (which GitHub can't reach).
on:
  # Dispatchable so a partly-failed publish can be finished without cutting a new
  # release. rc.27 lost its GitHub assets to a mirror-timing failure and there was
  # no way to retry the job — the only recovery was another rc. Dispatch with the
  # tag as the ref; every helper here is idempotent (create-or-reuse, replace
  # assets), so re-running a partial publish completes it rather than duplicating.
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]


jobs:
  # Dispatching from `main` would treat "main" as the version: packages named for
  # it, a wait for a tag that does not exist, and releases called `main` created
  # on all three hosts. The trigger exists for re-driving a TAG.
  guard:
    name: Refuse anything that is not a release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the ref
        run: |
          set -euo pipefail
          # The SAME grammar every other release step enforces, not a glob. `v0.3.0.dev1`
          # matches `v*.*.*` and is rejected by rel_validate_tag — and by every helper
          # downstream — so a glob here lets a dispatch start the PyPI upload and the builds
          # before anything refuses it.
          case "${GITHUB_REF}" in
            refs/tags/*) : ;;
            *) echo "::error::${GITHUB_REF} is not a tag — dispatch this with a release tag as the ref" >&2; exit 1 ;;
          esac
          # shellcheck source=/dev/null
          . packaging/release-common.sh
          rel_validate_tag "${GITHUB_REF_NAME}"
          echo "publishing ${GITHUB_REF_NAME}"

  pypi:
    name: Publish to PyPI
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_1
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_1.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Build + upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # Idempotent: a partial upload must stay retryable, otherwise the
          # release gate below blocks forever on the already-published file.
          twine upload --skip-existing dist/*

  releases:
    name: Create releases + Linux binary (Forgejo, NAS, GitHub)
    runs-on: ubuntu-latest
    # The integration manifest pins whiskerless==<this version>, and HACS offers
    # the update as soon as the GitHub release exists. Publishing that before
    # PyPI has the version leaves the first updaters unable to set the
    # integration up at all.
    needs: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_2
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_2.outcome != 'success'
        with:
          python-version: "3.14"
      # NO QEMU. This runner is amd64 and builds only amd64; arm64 is built on a native arm64
      # runner (.github/workflows/release-linux-arm64.yml). buildx is still used because its
      # context and output are client-side streams, which dodges the workspace-visibility problem
      # a bind mount hits when the job itself runs in a container — not because anything emulates.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # BuildKit has its own registry client and does not inherit dockerd's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["dockerhub-mirror.nas.bryantserver.com"]
      - name: Build the amd64 binary, .deb and .rpm (native — nothing is emulated here)
        id: build
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # The build-time pins live in packaging/release-pins.env and the script sources them
          # itself — one file, because the arm64 half of this release is built on GitHub and two
          # inline copies would drift the first time one was bumped.
          #
          # amd64 ONLY. arm64 is built natively by .github/workflows/release-linux-arm64.yml and
          # appended to this release afterwards — this runner is amd64, and emulating arm64 here
          # is what broke rc.18's Linux assets. build-linux-arch.sh refuses a host/target mismatch
          # rather than silently emulating, so that cannot come back by accident.
          bash packaging/build-linux-arch.sh amd64 "$GITHUB_REF_NAME"
      - name: Release notes from CHANGELOG
        run: bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create the three releases with the amd64 Linux artifacts
        run: |
          set -uo pipefail
          chmod +x packaging/forgejo-release.sh packaging/github-release.sh
          # The amd64 artifacts this runner built. The arm64 ones are appended to this same
          # release by the native arm64 job on GitHub, the way the macOS .pkg already is — so a
          # glob for them here would either match nothing or race that job.
          mapfile -t ASSETS < <(ls whiskerless-*-linux-x86_64 ./*_amd64.deb ./*.x86_64.rpm)
          # `ls` failing inside a process substitution cannot fail the step, so a missing artifact
          # would publish a short asset list and a checksum file to match — a release that looks
          # healthy and is not. Three is the whole per-arch set: binary, .deb, .rpm.
          [ "${#ASSETS[@]}" -eq 3 ] || {
            echo "::error::expected 3 amd64 artifacts, found ${#ASSETS[@]}: ${ASSETS[*]-}" >&2
            exit 1
          }
          # A checksum file so a download can be verified at all. The macOS .pkg
          # is signed and notarized because Gatekeeper refuses to run it
          # otherwise; nothing compels the Linux packages, and `dpkg -i` does not
          # check signatures even when they exist — so the practical gap is
          # "did this arrive intact", which a checksum closes without a signing
          # key to hold, rotate and revoke. It proves integrity, not authenticity:
          # it is served from the same host as the artifacts. Authenticity would
          # mean signing THIS file with a key published elsewhere, which is worth
          # doing only alongside an apt/dnf repository (backlog #75).
          #
          # The .pkg is absent here on purpose — it does not exist yet at this
          # point in the pipeline, being built later on GitHub's macOS runners.
          # Both spellings, because GitHub's asset API rewrites `~` to `.` in the
          # uploaded FILENAME (documented in packaging/README.md) while Forgejo
          # serves the canonical name. One manifest has to verify against either,
          # so an artifact whose name contains `~` is listed twice with the same
          # hash. Verify with `sha256sum -c --ignore-missing SHA256SUMS-$(uname -m)`;
          # the spelling you did not download is the one reported missing.
          #
          # One file PER ARCHITECTURE, named for `uname -m` so that command needs no
          # editing anywhere. Each is written by the machine that BUILT those bytes,
          # arm64 included — a checksum written by a host that did not build the
          # artifact is worth less. Published assets are immutable (reconcile and
          # prune-rcs both depend on that), so a single combined file could not be
          # appended to when the arm64 job lands later.
          sums="SHA256SUMS-x86_64"
          sha256sum "${ASSETS[@]}" | sed 's| \./| |' > "$sums"
          awk '$2 ~ /~/ { name = $2; gsub(/~/, ".", name); print $1 "  " name }' "$sums" >> "$sums.alt"
          [ -s "$sums.alt" ] && cat "$sums.alt" >> "$sums"
          rm -f "$sums.alt"
          ASSETS+=("$sums")
          echo "checksums:"; cat "$sums"
          # Every target is attempted even when an earlier one fails. Run
          # fail-fast and sequentially, one unreachable host costs every target
          # after it its release, and the tag-wait poll in each helper means a
          # dead host burns ten minutes before the next one is even tried.
          # Failures are collected and re-raised at the end, so the job still
          # goes red.
          failed=""
          packaging/forgejo-release.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || failed="$failed forgejo.bryantserver.com"
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || failed="$failed forgejo.nas.bryantserver.com"
          packaging/github-release.sh \
            "${{ secrets.GH_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${ASSETS[@]}" \
            || failed="$failed github.com"
          if [ -n "$failed" ]; then
            echo "::error::release publishing failed for:$failed"
            exit 1
          fi
  registry:
    name: Publish .deb/.rpm into the apt/dnf repositories
    needs: [guard, releases]
    # Runs even when a release UPLOAD failed — the repository is a fourth destination
    # with its own failure modes, and #76's lesson was that a job publishing to
    # independent places must not let the first failure skip the rest.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect BOTH architectures, then publish
        # A repository is not a release page: whatever lands there is what `apt install`
        # hands people immediately, with no way to tell the set is short. publish-registry.sh
        # refuses a partial set for that reason, and since arm64 moved to a native GitHub
        # runner this job's own workspace holds only half of it — so it reads the full set
        # off the release both forges publish to, and fails rather than publishing half.
        run: |
          set -euo pipefail
          chmod +x packaging/publish-registry.sh packaging/fetch-release-assets.sh
          select='.assets[]? | select(
                    (.name | endswith("_amd64.deb"))
                    or (.name | endswith("_arm64.deb"))
                    or (.name | endswith(".x86_64.rpm"))
                    or (.name | endswith(".aarch64.rpm"))
                  ) | .browser_download_url'
          # No `|| true`: an incomplete set must stop this job, not be published.
          packaging/fetch-release-assets.sh "$GITHUB_REF_NAME" 4 "$select"
          # A SEPARATE token from the release PAT: Forgejo scopes the package registry on its
          # own, and `write:repository` — everything the release helpers need — cannot upload a
          # package. Checked before writing this: the release token carries only
          # `write:repository`, so it would have 403d here.
          packaging/publish-registry.sh forgejo.bryantserver.com \
            "${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}" "$GITHUB_REF_NAME" ./*.deb ./*.rpm

  homebrew-tap:
    name: Update the Homebrew tap formula (stable or -rc per tag)
    # Shared with homebrew-bottles and tap-bottles.yml: three jobs write this one
    # repository, and two of them cloning the same tip means the loser pushes a
    # non-fast-forward and the tap keeps whichever block lost the race.
    concurrency:
      group: tap-write
      cancel-in-progress: false
    # After pypi: update-tap.sh requires PyPI to already serve bytes identical to
    # the sdist it builds locally, which is the whole point of the check.
    needs: pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_3
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_3.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Prove the formula installs before publishing it
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          # From a pristine export, like update-tap.sh: hatchling sweeps untracked
          # files beside the source into the sdist, which must not change what the
          # smoke installs.
          work="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$work"
          python -m build --sdist --outdir "$work/dist" "$work" >/dev/null
          # The sdist keeps its versioned filename: Homebrew derives the formula
          # version from the URL, and a versionless file:// url is a formula
          # Homebrew refuses before install.
          mkdir -p formula-smoke-dist
          cp "$work"/dist/whiskerless-*.tar.gz formula-smoke-dist/
          docker buildx build --build-arg TEST_TAG="$GITHUB_REF_NAME" \
            --build-arg BREW_MIRROR="https://image-mirror.nas.bryantserver.com" \
            -f packaging/homebrew-smoke.Dockerfile --target result \
            --output "type=local,dest=homebrew-smoke-result" .
          test -f homebrew-smoke-result/homebrew-smoke-passed
      - name: Fill the formula + push to the tap
        env:
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_TAP_WRITE_PAT }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          AUTH="http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          # Cloned OUTSIDE the checkout. update-tap.sh builds an sdist to compare against PyPI, and
          # anything left beside the source is swept into it — a tap clone here made the comparison
          # fail against a hash that was never wrong.
          tap="$(mktemp -d)/tap"
          git -c "$AUTH" clone "${GITHUB_SERVER_URL}/SisyphusMD/homebrew-tap.git" "$tap"
          chmod +x packaging/update-tap.sh
          bash packaging/update-tap.sh "$GITHUB_REF_NAME" "$tap"
          cd "$tap"
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add Formula/
          git commit -m "whiskerless ${GITHUB_REF_NAME#v}" || { echo "no change to publish"; exit 0; }
          git -c "$AUTH" push

  homebrew-bottles:
    name: Add the bottle block to the tap (second pass)
    concurrency:
      group: tap-write
      cancel-in-progress: false
    # The tap must already hold this version (the bottles were built by
    # installing it) and the release must exist (the bottles are its assets).
    needs: [guard, homebrew-tap, releases]
    # `releases` going red does not mean the bottles are missing — they are
    # appended by the GitHub workflow, to a release that may well have been
    # created successfully before some later host failed. #76 again.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Retried in-step: a transient versions-manifest fetch failure took all five CI
      # jobs down together on 2026-08-17, and Forgejo exposes no rerun endpoint, so
      # recovery has to happen inside the job. The guard is `!= 'success'`, not
      # `== 'failure'`: if a runner ever leaves `outcome` unset, an equality test would
      # silently skip the retry AND `continue-on-error` would have swallowed the first
      # failure, letting later steps run against whatever interpreter happened to be
      # present. This way an unknown outcome retries, and a failed retry fails the job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python_4
        continue-on-error: true
        with:
          python-version: "3.14"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.setup_python_4.outcome != 'success'
        with:
          python-version: "3.14"
      - name: Wait for every bottle manifest on the Forgejo release
        run: |
          set -euo pipefail
          API=https://forgejo.bryantserver.com/api/v1/repos/SisyphusMD/whiskerless
          # Four platforms. A stable tag bottles BOTH formulae — the stable one
          # and the rc one it re-points at itself — because a bottle's filename
          # embeds the formula name and its keg is rooted at
          # `<formula>/<version>/`, so one cannot be renamed into the other.
          # Without the second set, `brew install whiskerless-rc` after a stable
          # release silently goes back to compiling.
          case "$GITHUB_REF_NAME" in
            *-rc.*) expected=4 ;;
            *)      expected=8 ;;
          esac
          echo "waiting for $expected bottle manifest(s) and the archives they name"
          # The readiness condition is NOT "the manifests arrived". They are
          # uploaded in the same pass as the archives and their double-dash names
          # sort first, so the manifests are normally there while tarballs are
          # still in flight — a one-shot check would fail on a perfectly healthy
          # release. And names alone are not enough either: a re-run replaces an
          # archive in place, so a same-named file from the previous attempt can
          # be sitting there while the manifest already describes the new one.
          #
          # So the loop waits until every manifest is present AND every archive it
          # names hashes to the sha256 recorded for it. That is exactly the claim
          # the published formula makes, checked before making it — a formula
          # whose sha256 does not match the served file fails every install, and
          # unlike a missing block it does not fall back to building from source.
          #
          # Up to 60 minutes: the macOS legs build cryptography from source, twice
          # on a stable tag, on the slowest runners in the fleet.
          ready=""
          for _ in $(seq 1 180); do
            assets=$(curl -sf "$API/releases/tags/$GITHUB_REF_NAME" \
              | jq -r '.assets[]? | "\(.name)\t\(.browser_download_url)"' || true)
            urls=$(printf '%s\n' "$assets" | awk -F'\t' '$1 ~ /\.bottle\.json$/ {print $2}')
            if [ "$(printf '%s\n' "$urls" | grep -c . || true)" -lt "$expected" ]; then
              sleep 20; continue
            fi
            rm -rf manifests && mkdir -p manifests
            printf '%s\n' "$urls" | while read -r u; do
              [ -n "$u" ] && curl -sSL -o "manifests/$(basename "$u")" "$u"
            done
            ok=true
            while read -r name want; do
              [ -n "$name" ] || continue
              url=$(printf '%s\n' "$assets" | awk -F'\t' -v n="$name" '$1 == n {print $2}')
              if [ -z "$url" ]; then ok=false; break; fi
              got=$(curl -sSL "$url" | sha256sum | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then ok=false; break; fi
            done < <(jq -r '.[].bottle.tags[] | "\(.filename)\t\(.sha256)"' manifests/*.json)
            if [ "$ok" = true ]; then ready=1; break; fi
            sleep 20
          done
          if [ -z "$ready" ]; then
            echo "::error::the bottles never arrived intact after 60m — the tap keeps its unbottled formula"
            exit 1
          fi
          ls -l manifests/
          echo "every bottle the manifests name is present and matches its sha256"
      - name: Re-render the formula with the bottle block and push
        env:
          TOKEN: ${{ secrets.CLUSTER_FORGEJO_TAP_WRITE_PAT }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          AUTH="http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          # Outside the checkout, for the same reason the first pass does it:
          # update-tap.sh builds an sdist to compare against PyPI, and anything
          # sitting beside the source is swept into it.
          tap="$(mktemp -d)/tap"
          git -c "$AUTH" clone "${GITHUB_SERVER_URL}/SisyphusMD/homebrew-tap.git" "$tap"
          chmod +x packaging/update-tap.sh
          bash packaging/update-tap.sh "$GITHUB_REF_NAME" "$tap" "$PWD/manifests"
          cd "$tap"
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.bryantserver.com"
          git add Formula/
          git commit -m "whiskerless ${GITHUB_REF_NAME#v} bottles" || { echo "no change to publish"; exit 0; }
          git -c "$AUTH" push

  nas-bridge:
    name: Bridge the GitHub-built assets → NAS
    needs: [guard, releases]
    # Runs even when `releases` went red. It needs exactly one thing — the GitHub-built
    # assets on the public Forgejo release — and that has nothing to do with whether
    # GitHub accepted its copy. rc.27 proved the cost of coupling them: GitHub's release
    # step timed out waiting for a mirrored tag, the job failed, and the NAS was left
    # permanently short its two .pkg files for a reason entirely unrelated to the NAS.
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the GitHub-built assets on the public Forgejo release, then copy to NAS
        run: |
          # -e stays ON. Only the FETCH is allowed to fail softly, and an `|| partial=true`
          # OR-list is exempt from -e anyway — dropping -e for it also stopped the NAS upload
          # itself from failing the job, which would have reported a green bridge over a failed
          # copy and let prune-rcs delete candidates against it.
          set -euo pipefail
          chmod +x packaging/fetch-release-assets.sh packaging/forgejo-release.sh
          # Everything GitHub builds lands on the GitHub + public-Forgejo releases and stops
          # there, because the NAS is internal and no GitHub runner can reach it. That is now
          # two workflows' worth: the notarized .pkg (release-macos.yml) and the whole arm64
          # Linux set (release-linux-arm64.yml, which builds natively rather than emulating).
          #   2 .pkg (arm64 + x86_64) + arm64 binary + arm64 .deb + aarch64 .rpm + its checksums
          #
          # Named by suffix rather than by a substring like `arm64`, which would also match the
          # Homebrew bottles bottles.yml appends to this same release. Those are kept off the NAS
          # on purpose — reconcile excludes them too, because a bottle is not reproducible.
          select='.assets[]? | select(
                    (.name | endswith(".pkg"))
                    or (.name | endswith("-linux-arm64"))
                    or (.name | endswith("_arm64.deb"))
                    or (.name | endswith(".aarch64.rpm"))
                    or (.name == "SHA256SUMS-aarch64")
                  ) | .browser_download_url'
          # Upload what DID arrive before going red: a half-copied NAS beats an empty one, and
          # prune-rcs reads this job's verdict before deleting candidates either way. An earlier
          # version claimed to do this and did not — it downloaded and exited, so the NAS got
          # nothing at all.
          # NOT `mapfile < <(cmd) || partial=true`: mapfile reports on its own read from the
          # process substitution, which succeeds even when the command inside exits 1 — so a
          # short set would have uploaded quietly and reported success, the exact failure this
          # flag exists to prevent. Redirect to a file so the status is the fetcher's own.
          partial=false
          packaging/fetch-release-assets.sh "$GITHUB_REF_NAME" 6 "$select" > fetched.txt \
            || partial=true
          mapfile -t fetched < fetched.txt
          [ "${#fetched[@]}" -gt 0 ] || { echo "::error::nothing arrived to bridge to the NAS"; exit 1; }
          bash packaging/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md
          packaging/forgejo-release.sh forgejo.nas.bryantserver.com \
            "${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}" "$GITHUB_REF_NAME" notes.md "${fetched[@]}"
          if [ "$partial" = true ]; then
            echo "::error::the NAS release is incomplete for $GITHUB_REF_NAME"
            exit 1
          fi

  reconcile:
    name: Reconcile releases across registries (heal history)
    # `always()`: this exists precisely for the case where publishing to one of the three
    # registries failed, so gating it on those jobs SUCCEEDING would disable it in the only
    # situation it is for. It is warn-only for the same reason — a reconcile problem must not
    # make an otherwise valid release disappear, and the next release retries every tag.
    #
    # But it is ORDERED after nas-bridge, which is not the same as gated on it. Reconcile heals a
    # registry from a two-registry content quorum, and the assets GitHub builds — the .pkg and,
    # since arm64 went native, the whole arm64 Linux set — reach only ONE registry until the
    # bridge copies them to the NAS. Sweeping before that, there is no quorum to heal from: an
    # arm64 set that failed to upload to GitHub would stay missing, and prune-rcs (which needs
    # this job) would then delete the candidates that still had it.
    needs: [guard, releases, nas-bridge]
    if: ${{ always() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all tags needed for the reconcile loop
      - name: Reconcile every tag across all three registries
        # A remote filename or byte count is not evidence that an artifact is intact. This downloads
        # each recognised asset, accepts bytes only when at least two registries agree on the
        # SHA-256, and fills that content into any registry MISSING it. A registry already serving
        # DIFFERENT bytes is reported for a human, never overwritten: replacing means deleting
        # first, and a delete plus a failed re-upload destroys the only good copy.
        #
        # Homebrew bottles are deliberately outside this — see packaging/asset-roles.sh for why a
        # content quorum is the wrong model for an artifact that is not reproducible.
        env:
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
        run: |
          set -uo pipefail
          chmod +x packaging/reconcile-releases.sh packaging/forgejo-release.sh packaging/github-release.sh
          bash packaging/reconcile-releases.sh

  prune-rcs:
    name: Prune the candidates this release supersedes
    # Last, not after `releases`: the sweep deletes a candidate only once its
    # stable exists on all three hosts, and nas-bridge is what finishes the set.
    # Run any earlier and this release would find its own stable half-published
    # and keep every rc, turning the automatic pass into a silent no-op.
    #
    # Both, now that nas-bridge runs through a failed `releases`: pruning candidates
    # while this release is itself incomplete on some host is exactly the silent
    # no-op above, or worse.
    #
    # homebrew-bottles too, since #15: the sweep now deletes registry packages as
    # well as releases, and it must not start while this release is still
    # assembling the artifacts that replace them.
    #
    # And reconcile: the sweep's own precondition is that the stable is present and identical on
    # all three hosts, which is exactly what reconcile repairs. Pruning first would read a gap that
    # was about to be healed as a reason to keep every candidate — or, worse, delete the rc that
    # still held the only copy of content one host was missing.
    # `registry` too: prune's package check asks whether the stable REPLACES the candidate in the
    # repositories, so running while that upload is still in flight reads a not-yet-published
    # stable as a reason to keep every candidate — and then exits 0. Nothing re-runs the sweep,
    # so the leftovers would sit there until some later stable happened to win the race.
    needs: [releases, registry, nas-bridge, homebrew-tap, homebrew-bottles, reconcile]
    # An rc publishes through this same workflow, and its own stable does not
    # exist yet, so the sweep would enumerate every host to print zero. Skip it
    # rather than pay for the round trip.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prune
        env:
          DRY_RUN: "false"
          CLUSTER_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REPO_WRITE_PAT }}
          NAS_TOKEN: ${{ secrets.NAS_FORGEJO_REPO_WRITE_PAT }}
          GH_TOKEN: ${{ secrets.GH_REPO_WRITE_PAT }}
          PACKAGE_TOKEN: ${{ secrets.CLUSTER_FORGEJO_REGISTRY_PUSH_PAT }}
        run: |
          # Warn-only. The stable is already published by this point, so a prune problem must never
          # redden the release or make a valid stable look failed.
          bash packaging/prune-rcs.sh \
            || echo "::warning::prune-rcs exited nonzero; the stable release is unaffected"
